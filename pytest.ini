[pytest]
addopts = -m "not frontend_contract"
testpaths = backend/tests
norecursedirs =
    .git
    .gstack
    .omx
    .tmp
    .tmp-pytest
    .uv-cache
    .uv-python
    frontend
    node_modules
    backend/scripts
    backend/pytest-cache-files-*
cache_dir = backend/.pytest_cache
markers =
    frontend_contract: frontend source contract checks kept out of the default backend suite
