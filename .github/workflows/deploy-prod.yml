name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type 'deploy' to confirm production deployment
        required: true

jobs:
  deploy-prod:
    if: github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t xintai-backend:prod ./backend
      - name: Build frontend image
        run: docker build -t xintai-frontend:prod ./frontend
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            'cd /opt/xintai-data-center && git pull --ff-only && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build'
