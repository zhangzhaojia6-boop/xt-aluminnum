name: Daily Report Alignment Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type 'daily-align' to run production daily-report alignment
        required: true
      days:
        description: Recent business days to compare
        required: true
        default: '3'
      reference_mode:
        description: Use compare for pure real-source validation; adopt only for parser/rendering regression
        required: true
        default: 'compare'

jobs:
  daily-report-alignment-prod:
    if: github.event.inputs.confirm == 'daily-align'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Run production alignment against uploaded output-skill references
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
          OUTPUT_SKILL_ZIP_B64: ${{ secrets.DAILY_REPORT_OUTPUT_SKILL_ZIP_B64 }}
          DAYS: ${{ github.event.inputs.days }}
          REFERENCE_MODE: ${{ github.event.inputs.reference_mode }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$OUTPUT_SKILL_ZIP_B64"
          if ! printf '%s' "$DAYS" | grep -Eq '^[1-9][0-9]?$'; then
            echo "days must be 1-99"
            exit 2
          fi
          case "$REFERENCE_MODE" in
            compare|adopt) ;;
            *)
              echo "reference_mode must be compare or adopt"
              exit 2
              ;;
          esac

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          bundle="output-skill-${RUN_ID}.zip"
          printf '%s' "$OUTPUT_SKILL_ZIP_B64" | base64 -d > "$bundle"

          remote_bundle="/tmp/xintai-output-skill-${RUN_ID}.zip"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -o StrictHostKeyChecking=no "$bundle" "$SSH_USER@$SSH_HOST:$remote_bundle"

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "REMOTE_BUNDLE='$remote_bundle' DAYS='$DAYS' REFERENCE_MODE='$REFERENCE_MODE' RUN_ID='$RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          output_root="/tmp/xintai-output-skill-${RUN_ID}"
          artifact_dir="/srv/aluminum-bypass/docs/superpowers/reports/daily-report-fact-closure-production-${RUN_ID}"
          rm -rf "$output_root"
          mkdir -p "$output_root" "$artifact_dir"
          python3 - "$REMOTE_BUNDLE" "$output_root" <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import sys

          bundle = Path(sys.argv[1])
          output_root = Path(sys.argv[2])
          with ZipFile(bundle) as archive:
              archive.extractall(output_root)
          PY
          rm -f "$REMOTE_BUNDLE"

          cd /srv/aluminum-bypass/backend
          . .venv/bin/activate
          set +e
          python scripts/check_daily_report_output_skill_alignment.py \
            --output-skill-root "$output_root" \
            --days "$DAYS" \
            --reference-mode "$REFERENCE_MODE" \
            --artifact-dir "$artifact_dir" \
            --full-differences \
            --json
          status=$?
          set -e
          echo "ALIGNMENT_ARTIFACT_DIR=$artifact_dir"
          echo "ALIGNMENT_EXIT_CODE=$status"
          rm -rf "$output_root"
          exit "$status"
          REMOTE
