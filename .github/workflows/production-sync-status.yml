name: Production Sync Status

concurrency:
  group: xintai-production-ops
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type 'prod-sync' to confirm production status or exact-SHA deploy
        required: true
      mode:
        description: Read-only status, deploy current main heads, or roll back to merged ancestors
        required: true
        default: status
        type: choice
        options:
          - status
          - deploy
          - rollback
      datahub_sha:
        description: Full 40-character Data Hub commit SHA. Required for deploy mode.
        required: false
      hermes_sha:
        description: Full 40-character Hermes commit SHA. Required for deploy mode.
        required: false
      rollback_confirm:
        description: Type 'rollback-to-merged-sha' only when rollback mode is selected.
        required: false

jobs:
  production-sync-status:
    if: github.event.inputs.confirm == 'prod-sync'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    steps:
      - name: Check production status or deploy exact SHAs
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          MODE: ${{ github.event.inputs.mode }}
          DATAHUB_SHA: ${{ github.event.inputs.datahub_sha }}
          HERMES_SHA: ${{ github.event.inputs.hermes_sha }}
          ROLLBACK_CONFIRM: ${{ github.event.inputs.rollback_confirm }}
        run: |
          set -euo pipefail

          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          effective_mode="$MODE"
          case "$effective_mode" in
            status|deploy|rollback|sync) ;;
            *)
              echo "unsupported mode: $effective_mode"
              exit 2
              ;;
          esac
          if [ "$effective_mode" = "sync" ]; then
            echo "MODE_ALIAS=sync -> deploy"
            effective_mode="deploy"
          fi

          if [ "$effective_mode" = "deploy" ] || [ "$effective_mode" = "rollback" ]; then
            printf '%s' "$DATAHUB_SHA" | grep -Eq '^[0-9a-f]{40}$'
            printf '%s' "$HERMES_SHA" | grep -Eq '^[0-9a-f]{40}$'
          fi
          if [ "$effective_mode" = "rollback" ]; then
            test "$ROLLBACK_CONFIRM" = "rollback-to-merged-sha"
          fi
          if [ "$effective_mode" = "status" ]; then
            DATAHUB_SHA=""
            HERMES_SHA=""
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          append_remote_assignment() {
            local name="$1"
            local value="$2"
            printf -v REMOTE_PREAMBLE '%s%s=%q\n' "$REMOTE_PREAMBLE" "$name" "$value"
          }

          REMOTE_PREAMBLE=""
          append_remote_assignment MODE "$effective_mode"
          append_remote_assignment DATAHUB_SHA "$DATAHUB_SHA"
          append_remote_assignment HERMES_SHA "$HERMES_SHA"

          {
            printf '%s' "$REMOTE_PREAMBLE"
            cat <<'REMOTE'
          set -euo pipefail

          DATAHUB_REPO="/srv/aluminum-bypass"
          HERMES_REPO="/srv/hermes-cloud/runtime/.hermes/hermes-agent"
          DATAHUB_TRUSTED_REF="origin/main"
          HERMES_TRUSTED_REMOTE_URL="https://github.com/zhangzhaojia6-boop/hermes-agent.git"
          HERMES_TRUSTED_BRANCH="refs/heads/main"
          HERMES_TRUSTED_REF="refs/remotes/xintai_cloud/main"
          DATAHUB_ENV_FILE="$DATAHUB_REPO/backend/.env"
          BACKUP_DIR="$DATAHUB_REPO/backups"
          MODE="${MODE:-status}"
          DATAHUB_SHA="${DATAHUB_SHA:-}"
          HERMES_SHA="${HERMES_SHA:-}"
          DATAHUB_CHECKOUT_DONE=0
          HERMES_CHECKOUT_DONE=0
          NEEDS_DB_RESTORE=0
          DATAHUB_ENV_BACKUP=""
          HERMES_ENV_BACKUP=""
          DB_BACKUP=""
          DATABASE_LIBPQ_URL=""
          PREVIOUS_DATAHUB_HEAD="$(git -C "$DATAHUB_REPO" rev-parse HEAD)"
          PREVIOUS_HERMES_HEAD="$(git -C "$HERMES_REPO" rev-parse HEAD)"

          read_env_value() {
            local key="$1"
            local file="$2"
            [ -f "$file" ] || return 0
            { grep -E "^${key}=" "$file" || true; } | tail -n 1 | cut -d= -f2- | tr -d '\r'
          }

          upsert_env_value() {
            local file="$1"
            local key="$2"
            local value="$3"
            python3 - "$file" "$key" "$value" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          key = sys.argv[2]
          value = sys.argv[3]
          lines = path.read_text(encoding='utf-8').splitlines() if path.exists() else []
          output = []
          seen = False
          prefix = f"{key}="
          for line in lines:
              if line.startswith(prefix):
                  output.append(f"{key}={value}")
                  seen = True
              else:
                  output.append(line)
          if not seen:
              output.append(f"{key}={value}")
          path.write_text("\n".join(output) + "\n", encoding='utf-8')
          PY
          }

          backup_env_file() {
            local file="$1"
            if [ ! -f "$file" ]; then
              return 0
            fi
            local backup="${file}.backup-task10-$(date -u +%Y%m%dT%H%M%SZ)"
            cp -p "$file" "$backup"
            printf '%s' "$backup"
          }

          restore_env_backup() {
            local file="$1"
            local backup="$2"
            if [ -z "$backup" ]; then
              return 0
            fi
            if [ ! -f "$backup" ]; then
              return 1
            fi
            cp -pf "$backup" "$file"
          }

          detect_hermes_home() {
            local home
            home="$(systemctl show -p Environment --value hermes-gateway 2>/dev/null | tr ' ' '\n' | sed -n 's/^HERMES_HOME=//p' | tail -n 1)"
            if [ -n "$home" ]; then
              printf '%s\n' "$home"
            else
              dirname "$HERMES_REPO"
            fi
          }

          HERMES_HOME="$(detect_hermes_home)"
          HERMES_ENV_FILE="$HERMES_HOME/.env"
          HERMES_MANAGED_UV="$HERMES_HOME/bin/uv"
          HERMES_UV_VERSION="0.11.28"
          HERMES_RUNTIME_ENV_ROOT="$HERMES_HOME/runtime-envs"
          HERMES_RUNTIME_DROPIN_DIR="/etc/systemd/system/hermes-gateway.service.d"
          HERMES_RUNTIME_DROPIN_FILE="$HERMES_RUNTIME_DROPIN_DIR/10-xintai-runtime.conf"
          HERMES_RUNTIME_DROPIN_BACKUP=""
          HERMES_RUNTIME_DROPIN_EXISTED=0
          HERMES_TARGET_RUNTIME_ENV=""
          HERMES_GATEWAY_ARGS=""

          capture_hermes_gateway_command_contract() {
            local attempts="${1:-5}"
            local delay_seconds="${2:-1}"
            local attempt
            local runtime_pid
            local candidate_args
            local verifier_error_file
            local last_error="verification_error"
            HERMES_GATEWAY_ARGS=""
            verifier_error_file="$(mktemp /tmp/hermes-gateway-contract.XXXXXX)"
            for attempt in $(seq 1 "$attempts"); do
              runtime_pid="$(systemctl show -p MainPID --value hermes-gateway 2>/dev/null || true)"
              if printf '%s' "$runtime_pid" | grep -Eq '^[1-9][0-9]*$'; then
                : > "$verifier_error_file"
                if candidate_args="$(python3 - "$runtime_pid" 2>"$verifier_error_file" <<'PY'
          from pathlib import Path
          import re
          import shlex
          import subprocess
          import sys

          def classify_service_arg(value: str) -> str:
              known = {
                  "-P": "safe_path_flag",
                  "-m": "module_flag",
                  "hermes_cli.main": "hermes_module",
                  "-p": "profile_flag",
                  "gateway": "gateway_command",
                  "run": "run_command",
                  "--replace": "legacy_replace_flag",
              }
              if value in known:
                  return known[value]
              if value.startswith("-"):
                  return "option"
              if re.fullmatch(r"[A-Za-z0-9_.-]+", value) is not None:
                  return "safe_name"
              return "opaque"

          def verify_gateway_command_contract(
              runtime_pid: str,
              service_exec: str,
              service_pid: str,
              runtime_executable: str,
              runtime_argv: list[str],
          ) -> str:
              if service_pid != runtime_pid:
                  raise SystemExit("Hermes gateway MainPID changed during verification")
              if service_exec.count("argv[]=") != 1:
                  raise SystemExit("unexpected Hermes systemd ExecStart count")
              match = re.search(r"path=(\S+)\s*;\s*argv\[\]=(.*?)\s*;", service_exec)
              if match is None:
                  raise SystemExit("unexpected Hermes systemd ExecStart shape")
              service_path = Path(match.group(1)).resolve()
              service_args = shlex.split(match.group(2))
              if not service_args or service_path != Path(service_args[0]).resolve():
                  raise SystemExit("Hermes systemd executable mismatch")
              service_runtime_args = service_args[1:]
              command_args = service_runtime_args[1:] if service_runtime_args[:1] == ["-P"] else service_runtime_args
              if command_args[-1:] == ["--replace"]:
                  command_args = command_args[:-1]

              valid = command_args == ["-m", "hermes_cli.main", "gateway", "run"]
              if not valid:
                  valid = (
                      len(command_args) == 6
                      and command_args[:3] == ["-m", "hermes_cli.main", "-p"]
                      and re.fullmatch(r"[A-Za-z0-9_.-]+", command_args[3]) is not None
                      and command_args[4:] == ["gateway", "run"]
                  )
              if not valid:
                  classes = ",".join(classify_service_arg(value) for value in service_runtime_args)
                  raise SystemExit(
                      "unexpected Hermes gateway command shape:"
                      f"service_argc={len(service_runtime_args)}:"
                      f"service_classes={classes or 'none'}"
                  )
              if service_path != Path(runtime_executable).resolve():
                  raise SystemExit("Hermes systemd wrapper commands are unsupported")
              if runtime_argv not in (service_args, ["hermes"]):
                  raise SystemExit("Hermes running process has an unexpected title")
              return " ".join(command_args)

          if __name__ == "__main__":
              runtime_pid = sys.argv[1]
              service_exec = subprocess.check_output(
                  ["systemctl", "show", "-p", "ExecStart", "--value", "hermes-gateway"],
                  text=True,
              ).strip()
              service_pid = subprocess.check_output(
                  ["systemctl", "show", "-p", "MainPID", "--value", "hermes-gateway"],
                  text=True,
              ).strip()
              runtime_executable = str(Path(f"/proc/{runtime_pid}/exe").resolve())
              raw_args = Path(f"/proc/{runtime_pid}/cmdline").read_bytes().split(b"\0")
              runtime_argv = [item.decode("utf-8", errors="strict") for item in raw_args if item]
              print(
                  verify_gateway_command_contract(
                      runtime_pid,
                      service_exec,
                      service_pid,
                      runtime_executable,
                      runtime_argv,
                  )
              )
          PY
                )" && [ -n "$candidate_args" ]; then
                  HERMES_GATEWAY_ARGS="$candidate_args"
                  rm -f "$verifier_error_file"
                  echo "HERMES_GATEWAY_COMMAND_ATTEMPT=${attempt}/${attempts}:accepted"
                  echo "HERMES_GATEWAY_COMMAND_CONTRACT=accepted"
                  return 0
                fi
                last_error="$(tail -n 1 "$verifier_error_file" 2>/dev/null || true)"
                echo "HERMES_GATEWAY_COMMAND_ATTEMPT=${attempt}/${attempts}:rejected"
              else
                last_error="main_pid_unavailable"
                echo "HERMES_GATEWAY_COMMAND_ATTEMPT=${attempt}/${attempts}:main_pid_unavailable"
              fi
              if [ "$attempt" -lt "$attempts" ]; then
                sleep "$delay_seconds"
              fi
            done
            rm -f "$verifier_error_file"
            case "$last_error" in
              main_pid_unavailable|verification_error|\
              "unexpected Hermes gateway command shape:service_argc="*":service_classes="*|\
              "unexpected Hermes systemd ExecStart count"|\
              "unexpected Hermes systemd ExecStart shape"|\
              "Hermes gateway MainPID changed during verification"|\
              "Hermes systemd executable mismatch"|\
              "Hermes systemd wrapper commands are unsupported"|\
              "Hermes running process has an unexpected title") ;;
              *) last_error="verification_error" ;;
            esac
            echo "HERMES_GATEWAY_COMMAND_ERROR=$last_error"
            echo "HERMES_GATEWAY_COMMAND_CONTRACT=rejected"
            return 1
          }

          backup_hermes_runtime_dropin() {
            if [ -f "$HERMES_RUNTIME_DROPIN_FILE" ]; then
              HERMES_RUNTIME_DROPIN_BACKUP="$(mktemp /tmp/hermes-runtime-dropin.XXXXXX)"
              cp -p "$HERMES_RUNTIME_DROPIN_FILE" "$HERMES_RUNTIME_DROPIN_BACKUP"
              HERMES_RUNTIME_DROPIN_EXISTED=1
            else
              HERMES_RUNTIME_DROPIN_BACKUP=""
              HERMES_RUNTIME_DROPIN_EXISTED=0
            fi
            echo "HERMES_RUNTIME_DROPIN_EXISTED=$HERMES_RUNTIME_DROPIN_EXISTED"
          }

          restore_hermes_runtime_dropin() {
            if [ "${HERMES_RUNTIME_DROPIN_EXISTED:-0}" = "1" ]; then
              if [ -z "${HERMES_RUNTIME_DROPIN_BACKUP:-}" ] || [ ! -f "$HERMES_RUNTIME_DROPIN_BACKUP" ]; then
                return 1
              fi
              install -d -m 755 "$HERMES_RUNTIME_DROPIN_DIR"
              install -m 644 "$HERMES_RUNTIME_DROPIN_BACKUP" "$HERMES_RUNTIME_DROPIN_FILE"
            else
              rm -f "$HERMES_RUNTIME_DROPIN_FILE"
            fi
            systemctl daemon-reload
            if [ -n "${HERMES_RUNTIME_DROPIN_BACKUP:-}" ]; then
              rm -f "$HERMES_RUNTIME_DROPIN_BACKUP"
              HERMES_RUNTIME_DROPIN_BACKUP=""
            fi
          }

          write_hermes_runtime_dropin() {
            local runtime_env="$1"
            local runtime_python="$runtime_env/bin/python"
            local dropin_tmp
            local service_path
            case "$runtime_env" in
              "$HERMES_RUNTIME_ENV_ROOT"/[0-9a-f][0-9a-f]*) ;;
              *)
                echo "HERMES_RUNTIME_ENV_PATH_REJECTED"
                return 1
                ;;
            esac
            if [ ! -x "$runtime_python" ]; then
              echo "HERMES_RUNTIME_PYTHON_MISSING=$runtime_python"
              return 1
            fi
            if [ -z "$HERMES_GATEWAY_ARGS" ]; then
              echo "HERMES_GATEWAY_COMMAND_CONTRACT=missing"
              return 1
            fi
            service_path="$(systemctl show -p Environment --value hermes-gateway 2>/dev/null | tr ' ' '\n' | sed -n 's/^PATH=//p' | tail -n 1)"
            service_path="${service_path:-/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin}"
            dropin_tmp="$(mktemp /tmp/hermes-runtime-dropin-new.XXXXXX)"
            cat > "$dropin_tmp" <<EOF
          [Service]
          ExecStart=
          ExecStart=$runtime_python -P $HERMES_GATEWAY_ARGS
          Environment="VIRTUAL_ENV=$runtime_env"
          Environment="PATH=$runtime_env/bin:$service_path"
          EOF
            install -d -m 755 "$HERMES_RUNTIME_DROPIN_DIR"
            install -m 644 "$dropin_tmp" "$HERMES_RUNTIME_DROPIN_FILE"
            rm -f "$dropin_tmp"
            systemctl daemon-reload
            echo "HERMES_RUNTIME_DROPIN_INSTALLED=$HERMES_RUNTIME_DROPIN_FILE"
          }

          install_managed_uv() {
            local uv_arch
            local uv_archive
            local uv_asset
            local uv_binary
            local uv_extract_dir
            local uv_sha256
            if [ -x "$HERMES_MANAGED_UV" ]; then
              test "$("$HERMES_MANAGED_UV" --version)" = "uv $HERMES_UV_VERSION"
              echo "HERMES_MANAGED_UV_VERSION=$HERMES_UV_VERSION"
              return
            fi
            uv_arch="$(uname -m)"
            case "$uv_arch" in
              x86_64)
                uv_asset="uv-x86_64-unknown-linux-gnu.tar.gz"
                uv_sha256="e490a6464492183c5d4534a5527fb4440f7f2bb2f228162ad7e4afe076dc0224"
                ;;
              aarch64|arm64)
                uv_asset="uv-aarch64-unknown-linux-gnu.tar.gz"
                uv_sha256="03e9fe0a81b0718d0bc84625de3885df6cc3f89a8b6af6121d6b9f6113fb6533"
                ;;
              *)
                echo "HERMES_UV_UNSUPPORTED_ARCH=$uv_arch"
                return 1
                ;;
            esac
            uv_archive="$(mktemp /tmp/hermes-uv.XXXXXX.tar.gz)"
            uv_extract_dir="$(mktemp -d /tmp/hermes-uv-extract.XXXXXX)"
            if ! curl -LsSf "https://github.com/astral-sh/uv/releases/download/$HERMES_UV_VERSION/$uv_asset" -o "$uv_archive"; then
              rm -f "$uv_archive"
              rm -rf -- "$uv_extract_dir"
              return 1
            fi
            if ! printf '%s  %s\n' "$uv_sha256" "$uv_archive" | sha256sum -c -; then
              rm -f "$uv_archive"
              rm -rf -- "$uv_extract_dir"
              return 1
            fi
            if ! tar -xzf "$uv_archive" -C "$uv_extract_dir"; then
              rm -f "$uv_archive"
              rm -rf -- "$uv_extract_dir"
              return 1
            fi
            uv_binary="$(find "$uv_extract_dir" -type f -name uv -print -quit)"
            if [ -z "$uv_binary" ] || [ ! -x "$uv_binary" ]; then
              rm -f "$uv_archive"
              rm -rf -- "$uv_extract_dir"
              return 1
            fi
            install -d -m 755 "$HERMES_HOME/bin"
            install -m 755 "$uv_binary" "$HERMES_MANAGED_UV"
            rm -f "$uv_archive"
            rm -rf -- "$uv_extract_dir"
            test -x "$HERMES_MANAGED_UV"
            test "$("$HERMES_MANAGED_UV" --version)" = "uv $HERMES_UV_VERSION"
            echo "HERMES_MANAGED_UV_VERSION=$HERMES_UV_VERSION"
          }

          verify_hermes_runtime_env() {
            local runtime_env="$1"
            "$runtime_env/bin/python" - <<'PY'
          from importlib import metadata, util
          from pathlib import Path
          import sys

          if not ((3, 11) <= sys.version_info[:2] < (3, 14)):
              raise SystemExit("unsupported Hermes Python runtime")
          hermes_spec = util.find_spec("hermes_cli.main")
          if hermes_spec is None or hermes_spec.origin is None:
              raise SystemExit("hermes_cli.main is unavailable")
          if util.find_spec("dingtalk_stream") is None:
              raise SystemExit("dingtalk_stream is unavailable")
          runtime_root = Path(sys.prefix).resolve()
          package_origin = Path(hermes_spec.origin).resolve()
          if runtime_root != package_origin and runtime_root not in package_origin.parents:
              raise SystemExit("HERMES_TARGET_PACKAGE_OUTSIDE_RUNTIME")
          print("HERMES_TARGET_PYTHON_VERSION=" + ".".join(str(part) for part in sys.version_info[:3]))
          print(f"HERMES_TARGET_PACKAGE_VERSION={metadata.version('hermes-agent')}")
          print(f"HERMES_TARGET_DINGTALK_STREAM_VERSION={metadata.version('dingtalk-stream')}")
          PY
          }

          prepare_hermes_runtime() {
            local target_sha="$1"
            local build_source=""
            local release_env
            local runtime_created=0
            local service_user
            printf '%s' "$target_sha" | grep -Eq '^[0-9a-f]{40}$'
            release_env="$HERMES_RUNTIME_ENV_ROOT/$target_sha"
            install -d -m 755 "$HERMES_RUNTIME_ENV_ROOT"
            if [ -e "$release_env" ]; then
              if ! verify_hermes_runtime_env "$release_env"; then
                echo "HERMES_RUNTIME_ENV_INVALID=$release_env"
                return 1
              fi
              echo "HERMES_RUNTIME_ENV_REUSED=$release_env"
            else
              install_managed_uv
              UV_NO_CONFIG=1 \
                UV_PYTHON_INSTALL_DIR=/usr/local/share/uv/python \
                UV_PYTHON_BIN_DIR=/usr/local/share/uv/bin \
                "$HERMES_MANAGED_UV" python install 3.11
              if ! UV_NO_CONFIG=1 \
                UV_PYTHON_INSTALL_DIR=/usr/local/share/uv/python \
                UV_PYTHON_BIN_DIR=/usr/local/share/uv/bin \
                "$HERMES_MANAGED_UV" venv "$release_env" --python 3.11; then
                rm -rf -- "$release_env"
                return 1
              fi
              runtime_created=1
              build_source="$(mktemp -d "/tmp/hermes-build.${target_sha}.XXXXXX")"
              if ! git -C "$HERMES_REPO" archive "$target_sha" | tar -x -C "$build_source"; then
                rm -rf -- "$build_source"
                rm -rf -- "$release_env"
                return 1
              fi
              if ! (
                cd "$build_source" &&
                UV_NO_CONFIG=1 \
                UV_PYTHON_INSTALL_DIR=/usr/local/share/uv/python \
                UV_PYTHON_BIN_DIR=/usr/local/share/uv/bin \
                UV_PROJECT_ENVIRONMENT="$release_env" \
                UV_PYTHON="$release_env/bin/python" \
                VIRTUAL_ENV="$release_env" \
                "$HERMES_MANAGED_UV" sync --locked --extra dingtalk --no-editable
              ); then
                rm -rf -- "$build_source"
                rm -rf -- "$release_env"
                return 1
              fi
              rm -rf -- "$build_source"
              if ! verify_hermes_runtime_env "$release_env"; then
                if [ "$runtime_created" = "1" ]; then
                  rm -rf -- "$release_env"
                fi
                return 1
              fi
              echo "HERMES_RUNTIME_ENV_CREATED=$release_env"
            fi
            service_user="$(systemctl show -p User --value hermes-gateway 2>/dev/null || true)"
            service_user="${service_user:-root}"
            if [ "$service_user" != "root" ]; then
              runuser -u "$service_user" -- "$release_env/bin/python" -c \
                'from importlib import util; assert util.find_spec("hermes_cli.main"); assert util.find_spec("dingtalk_stream")'
            fi
            HERMES_TARGET_RUNTIME_ENV="$release_env"
          }

          git_tracked_clean() {
            local repo="$1"
            git -C "$repo" diff --quiet && git -C "$repo" diff --cached --quiet
          }

          print_repo_status() {
            local label="$1"
            local repo="$2"
            local tracked_state="clean"
            if ! git_tracked_clean "$repo"; then
              tracked_state="dirty"
            fi
            echo "${label}_BRANCH=$(git -C "$repo" branch --show-current)"
            echo "${label}_HEAD=$(git -C "$repo" rev-parse HEAD)"
            echo "${label}_TRACKED_STATE=$tracked_state"
            echo "${label}_UNTRACKED_START"
            git -C "$repo" ls-files --others --exclude-standard || true
            echo "${label}_UNTRACKED_END"
          }

          require_clean_tracked() {
            local label="$1"
            local repo="$2"
            if ! git_tracked_clean "$repo"; then
              echo "${label}_TRACKED_LOCAL_CHANGES_DETECTED"
              git -C "$repo" status --short
              exit 30
            fi
          }

          require_commit_exists() {
            local repo="$1"
            local sha="$2"
            git -C "$repo" fetch origin --prune --tags
            git -C "$repo" cat-file -e "${sha}^{commit}"
          }

          update_trusted_refs() {
            git -C "$DATAHUB_REPO" fetch --prune origin main
            if ! git -C "$HERMES_REPO" fetch --prune "$HERMES_TRUSTED_REMOTE_URL" "+$HERMES_TRUSTED_BRANCH:$HERMES_TRUSTED_REF"; then
              echo "HERMES_TRUSTED_REF_UNAVAILABLE"
              exit 90
            fi
          }

          require_trusted_head() {
            local repo="$1"
            local sha="$2"
            local trusted_ref="$3"
            local label="$4"
            local trusted_head
            trusted_head="$(git -C "$repo" rev-parse "$trusted_ref")"
            if [ "$sha" != "$trusted_head" ]; then
              echo "${label}_SHA_NOT_TRUSTED_HEAD requested=$sha trusted=$trusted_head"
              exit 91
            fi
          }

          require_trusted_ancestor() {
            local repo="$1"
            local sha="$2"
            local trusted_ref="$3"
            local label="$4"
            if ! git -C "$repo" merge-base --is-ancestor "$sha" "$trusted_ref"; then
              echo "${label}_SHA_NOT_MERGED requested=$sha trusted_ref=$trusted_ref"
              exit 92
            fi
          }

          libpq_url_from_database_url() {
            local database_url="$1"
            DATABASE_URL="$database_url" "$DATAHUB_REPO/backend/.venv/bin/python" - <<'PY'
          import os
          from sqlalchemy.engine import make_url

          url = make_url(os.environ["DATABASE_URL"])
          print(url.set(drivername=url.drivername.split("+", 1)[0]).render_as_string(hide_password=False))
          PY
          }

          get_alembic_revisions() {
            local database_url="$1"
            DATABASE_URL="$database_url" "$DATAHUB_REPO/backend/.venv/bin/python" - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"], future=True)
          with engine.connect() as conn:
              rows = conn.execute(text("SELECT version_num FROM alembic_version ORDER BY version_num")).scalars().all()
          print(",".join(str(row) for row in rows))
          PY
          }

          alembic_revisions_valid() {
            local revisions="${1:-}"
            [[ "$revisions" =~ ^[0-9A-Za-z_]+(,[0-9A-Za-z_]+)*$ ]]
          }

          alembic_single_revision_valid() {
            local revision="${1:-}"
            alembic_revisions_valid "$revision" && [[ "$revision" != *,* ]]
          }

          report_http_json() {
            local label="$1"
            local url="$2"
            local target_file="$3"
            if curl -fsS "$url" > "$target_file"; then
              echo "${label}_URL=$url"
              python3 - "$target_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
          PY
            else
              echo "${label}_URL=$url"
              echo "${label}_FAILED"
              return 1
            fi
          }

          query_stream_persistence() {
            local database_url="$1"
            DATABASE_URL="$database_url" "$DATAHUB_REPO/backend/.venv/bin/python" - <<'PY'
          import json
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"], future=True)
          payload = {
              "chat_inbox_count": 0,
              "chat_inbox_latest_at": None,
              "chat_inbox_latest_trace_id": None,
              "multimodal_evidence_count": 0,
              "multimodal_evidence_latest_at": None,
              "multimodal_evidence_latest_trace_id": None,
          }
          with engine.connect() as conn:
              inbox = conn.execute(
                  text(
                      """
                      SELECT COUNT(*) AS total,
                             MAX(created_at) AS latest_at,
                             (
                               SELECT trace_id
                               FROM chat_inbox
                               WHERE source_payload->>'source_transport' = 'dingtalk_stream'
                               ORDER BY created_at DESC, id DESC
                               LIMIT 1
                             ) AS latest_trace_id
                      FROM chat_inbox
                      WHERE source_payload->>'source_transport' = 'dingtalk_stream'
                      """
                  )
              ).mappings().one()
              evidence = conn.execute(
                  text(
                      """
                      SELECT COUNT(*) AS total,
                             MAX(created_at) AS latest_at,
                             (
                               SELECT payload->>'trace_id'
                               FROM multimodal_evidence
                               WHERE payload IS NOT NULL
                                 AND payload->>'source' = 'dingtalk'
                                 AND payload->>'source_transport' = 'dingtalk_stream'
                               ORDER BY created_at DESC, id DESC
                               LIMIT 1
                             ) AS latest_trace_id
                      FROM multimodal_evidence
                      WHERE payload IS NOT NULL
                        AND payload->>'source' = 'dingtalk'
                        AND payload->>'source_transport' = 'dingtalk_stream'
                      """
                  )
              ).mappings().one()
          payload["chat_inbox_count"] = int(inbox["total"] or 0)
          payload["chat_inbox_latest_at"] = None if inbox["latest_at"] is None else str(inbox["latest_at"])
          payload["chat_inbox_latest_trace_id"] = inbox["latest_trace_id"]
          payload["multimodal_evidence_count"] = int(evidence["total"] or 0)
          payload["multimodal_evidence_latest_at"] = None if evidence["latest_at"] is None else str(evidence["latest_at"])
          payload["multimodal_evidence_latest_trace_id"] = evidence["latest_trace_id"]
          print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
          PY
          }

          verify_smoke_trace_persisted() {
            local database_url="$1"
            local trace_id="$2"
            DATABASE_URL="$database_url" TRACE_ID="$trace_id" "$DATAHUB_REPO/backend/.venv/bin/python" - <<'PY'
          import json
          import os
          from sqlalchemy import create_engine, text

          trace_id = os.environ["TRACE_ID"]
          engine = create_engine(os.environ["DATABASE_URL"], future=True)
          with engine.connect() as conn:
              inbox = conn.execute(
                  text("SELECT id, created_at FROM chat_inbox WHERE trace_id = :trace_id ORDER BY id DESC LIMIT 1"),
                  {"trace_id": trace_id},
              ).mappings().first()
              evidence = conn.execute(
                  text(
                      """
                      SELECT id, created_at
                      FROM multimodal_evidence
                      WHERE payload IS NOT NULL
                        AND payload->>'trace_id' = :trace_id
                      ORDER BY id DESC
                      LIMIT 1
                      """
                  ),
                  {"trace_id": trace_id},
              ).mappings().first()
          if inbox is None or evidence is None:
              raise SystemExit(1)
          print(
              json.dumps(
                  {
                      "trace_id": trace_id,
                      "chat_inbox_id": int(inbox["id"]),
                      "chat_inbox_created_at": str(inbox["created_at"]),
                      "multimodal_evidence_id": int(evidence["id"]),
                      "multimodal_evidence_created_at": str(evidence["created_at"]),
                  },
                  ensure_ascii=False,
                  sort_keys=True,
              )
          )
          PY
          }

          report_hermes_runtime() {
            local host_os_id="unknown"
            local host_os_version_id="unknown"
            local host_python_311
            local host_python_312
            local host_uv
            local runtime_pid
            local runtime_python
            if [ -r /etc/os-release ]; then
              host_os_id="$(. /etc/os-release; printf '%s' "${ID:-unknown}")"
              host_os_version_id="$(. /etc/os-release; printf '%s' "${VERSION_ID:-unknown}")"
            fi
            host_uv="$(command -v uv 2>/dev/null || true)"
            host_python_311="$(command -v python3.11 2>/dev/null || true)"
            host_python_312="$(command -v python3.12 2>/dev/null || true)"
            echo "HERMES_SERVICE_FRAGMENT_PATH=$(systemctl show -p FragmentPath --value hermes-gateway 2>/dev/null || true)"
            echo "HERMES_SERVICE_USER=$(systemctl show -p User --value hermes-gateway 2>/dev/null || true)"
            echo "HERMES_SERVICE_WORKING_DIRECTORY=$(systemctl show -p WorkingDirectory --value hermes-gateway 2>/dev/null || true)"
            echo "HERMES_HOST_OS_ID=$host_os_id"
            echo "HERMES_HOST_OS_VERSION_ID=$host_os_version_id"
            echo "HERMES_HOST_UV=${host_uv:-missing}"
            echo "HERMES_HOST_PYTHON_3_11=${host_python_311:-missing}"
            echo "HERMES_HOST_PYTHON_3_12=${host_python_312:-missing}"
            runtime_pid="$(systemctl show -p MainPID --value hermes-gateway 2>/dev/null || true)"
            if ! printf '%s' "$runtime_pid" | grep -Eq '^[1-9][0-9]*$'; then
              echo "HERMES_RUNTIME_PYTHON=unavailable"
              echo "HERMES_RUNTIME_INSPECTION=main_pid_unavailable"
              return 0
            fi
            runtime_python="$(readlink -f "/proc/$runtime_pid/exe" 2>/dev/null || true)"
            echo "HERMES_RUNTIME_PYTHON=${runtime_python:-unavailable}"
            echo "HERMES_RUNTIME_CWD=$(readlink -f "/proc/$runtime_pid/cwd" 2>/dev/null || true)"
            if [ -z "$runtime_python" ] || [ ! -x "$runtime_python" ]; then
              echo "HERMES_RUNTIME_INSPECTION=executable_unavailable"
              return 0
            fi
            case "$runtime_python" in
              */python|*/python[0-9]|*/python[0-9].*) ;;
              *)
                echo "HERMES_RUNTIME_INSPECTION=main_process_is_not_python"
                return 0
                ;;
            esac
            "$runtime_python" - "$runtime_pid" <<'PY'
          from importlib import metadata
          from pathlib import Path
          import re
          import sys

          def package_version(name: str) -> str:
              try:
                  return metadata.version(name)
              except metadata.PackageNotFoundError:
                  return "missing"

          def safe_entrypoint(value: str) -> str:
              if len(value) > 300 or not re.fullmatch(r"[A-Za-z0-9_./:-]+", value):
                  return "redacted"
              if re.search(r"secret|token|password|credential|app[_-]?key", value, re.IGNORECASE):
                  return "redacted"
              return value

          runtime_pid = sys.argv[1]
          raw_args = Path(f"/proc/{runtime_pid}/cmdline").read_bytes().split(b"\0")
          args = [item.decode("utf-8", errors="replace") for item in raw_args if item]
          entrypoint = "unavailable"
          if len(args) >= 3 and args[1] == "-m":
              entrypoint = "module:" + safe_entrypoint(args[2])
          elif len(args) >= 2:
              entrypoint = "script:" + safe_entrypoint(args[1])

          print("HERMES_RUNTIME_PYTHON_VERSION=" + ".".join(str(part) for part in sys.version_info[:3]))
          print(f"HERMES_RUNTIME_PREFIX={sys.prefix}")
          print(f"HERMES_RUNTIME_BASE_PREFIX={sys.base_prefix}")
          print(f"HERMES_RUNTIME_IS_VENV={str(sys.prefix != sys.base_prefix).lower()}")
          print(f"HERMES_RUNTIME_PACKAGE_VERSION={package_version('hermes-agent')}")
          print(f"HERMES_RUNTIME_DINGTALK_STREAM_VERSION={package_version('dingtalk-stream')}")
          print(f"HERMES_RUNTIME_ENTRYPOINT={entrypoint}")
          PY
          }

          report_stream_connection() {
            local require_connected="$1"
            local attempts="${2:-1}"
            local delay_seconds="${3:-0}"
            local active_since
            local connected_line
            local attempt
            active_since="$(systemctl show -p ActiveEnterTimestamp --value hermes-gateway)"
            echo "HERMES_ACTIVE_ENTER_TIMESTAMP=$active_since"
            connected_line=""
            for attempt in $(seq 1 "$attempts"); do
              connected_line="$(journalctl -u hermes-gateway --since "$active_since" --no-pager -o short-iso 2>/dev/null | grep -F 'Connected via Stream Mode' | tail -n 1 || true)"
              if [ -n "$connected_line" ]; then
                break
              fi
              if ! systemctl is-active --quiet hermes-gateway; then
                echo "HERMES_GATEWAY_INACTIVE_DURING_STREAM_WAIT"
                break
              fi
              if [ "$attempt" -lt "$attempts" ]; then
                sleep "$delay_seconds"
              fi
            done
            if [ -n "$connected_line" ]; then
              echo "HERMES_STREAM_CONNECTED=yes"
              echo "HERMES_STREAM_CONNECTED_LINE=$connected_line"
            else
              echo "HERMES_STREAM_CONNECTED=no"
              echo "HERMES_STREAM_CONNECTED_LINE=none"
              if [ "$require_connected" = "yes" ]; then
                return 1
              fi
            fi
          }

          report_status() {
            local version_required="$1"

            print_repo_status "DATAHUB" "$DATAHUB_REPO"
            print_repo_status "HERMES" "$HERMES_REPO"

            echo "SERVICE_STATUS_START"
            systemctl is-active aluminum-bypass hermes-gateway nginx
            echo "SERVICE_STATUS_END"

            if [ "$version_required" = "yes" ]; then
              report_http_json "READYZ" "http://127.0.0.1:8000/readyz" /tmp/readyz.json
            else
              report_http_json "READYZ" "http://127.0.0.1:8000/readyz" /tmp/readyz.json || true
            fi
            if [ "$version_required" = "yes" ]; then
              report_http_json "VERSIONZ" "http://127.0.0.1:8000/versionz" /tmp/versionz.json
            else
              report_http_json "VERSIONZ" "http://127.0.0.1:8000/versionz" /tmp/versionz.json || true
            fi

            report_hermes_runtime
            if capture_hermes_gateway_command_contract; then
              echo "HERMES_GATEWAY_DEPLOY_CONTRACT=ready"
            else
              echo "HERMES_GATEWAY_DEPLOY_CONTRACT=rejected"
            fi
            report_stream_connection "no" || true
            echo "STREAM_PERSISTENCE=$(query_stream_persistence "$RAW_DATABASE_URL")"
          }

          reload_or_restart_nginx() {
            if systemctl reload nginx; then
              return 0
            fi
            systemctl restart nginx
          }

          rollback_on_error() {
            local exit_code="${1:-1}"
            local rollback_failed=0
            local rollback_state_failed=0
            local rollback_current_revisions=""
            trap - EXIT ERR
            echo "DEPLOY_FAILED_ROLLBACK_START"
            if ! systemctl stop aluminum-bypass hermes-gateway; then
              echo "ROLLBACK_FAILED_STOP_RUNTIME_SERVICES"
              echo "DEPLOY_FAILED_ROLLBACK_INCOMPLETE"
              exit 97
            fi
            if [ "$NEEDS_DB_RESTORE" = "1" ] && [ -n "${PRE_MIGRATION_REVISIONS:-}" ]; then
              if ! alembic_single_revision_valid "$PRE_MIGRATION_REVISIONS"; then
                echo "ROLLBACK_FAILED_DATABASE_DOWNGRADE_PRE_REVISION"
                rollback_failed=1
                rollback_state_failed=1
              elif ! rollback_current_revisions="$(get_alembic_revisions "$RAW_DATABASE_URL")"; then
                echo "ROLLBACK_FAILED_DATABASE_DOWNGRADE_CURRENT_REVISION"
                rollback_failed=1
                rollback_state_failed=1
              elif [ "$rollback_current_revisions" != "$PRE_MIGRATION_REVISIONS" ]; then
                echo "ROLLBACK_DATABASE_DOWNGRADE_TO=$PRE_MIGRATION_REVISIONS"
                if ! (
                  cd "$DATAHUB_REPO/backend" &&
                  DATABASE_URL="$RAW_DATABASE_URL" ./.venv/bin/python -m alembic downgrade "$PRE_MIGRATION_REVISIONS"
                ); then
                  echo "ROLLBACK_FAILED_DATABASE_DOWNGRADE"
                  rollback_failed=1
                  rollback_state_failed=1
                fi
              else
                echo "ROLLBACK_DATABASE_DOWNGRADE_SKIPPED=already_at_pre_deploy_revision"
              fi
            else
              echo "ROLLBACK_DATABASE_DOWNGRADE_SKIPPED=no_migration_state_change"
            fi
            if [ "$DATAHUB_CHECKOUT_DONE" = "1" ]; then
              if ! git -C "$DATAHUB_REPO" checkout --detach "$PREVIOUS_DATAHUB_HEAD"; then
                echo "ROLLBACK_FAILED_DATAHUB_REPO"
                rollback_failed=1
                rollback_state_failed=1
              fi
            fi
            if [ "$HERMES_CHECKOUT_DONE" = "1" ]; then
              if ! git -C "$HERMES_REPO" checkout --detach "$PREVIOUS_HERMES_HEAD"; then
                echo "ROLLBACK_FAILED_HERMES_REPO"
                rollback_failed=1
                rollback_state_failed=1
              fi
            fi
            if ! restore_env_backup "$DATAHUB_ENV_FILE" "$DATAHUB_ENV_BACKUP"; then
              echo "ROLLBACK_FAILED_DATAHUB_ENV"
              rollback_failed=1
              rollback_state_failed=1
            fi
            if ! restore_env_backup "$HERMES_ENV_FILE" "$HERMES_ENV_BACKUP"; then
              echo "ROLLBACK_FAILED_HERMES_ENV"
              rollback_failed=1
              rollback_state_failed=1
            fi
            if [ "$NEEDS_DB_RESTORE" = "1" ]; then
              if [ -n "$DB_BACKUP" ] && [ -f "$DB_BACKUP" ]; then
                echo "ROLLBACK_DATABASE_FROM=$DB_BACKUP"
                if ! pg_restore --single-transaction --exit-on-error --clean --if-exists --no-owner --no-privileges -d "$DATABASE_LIBPQ_URL" "$DB_BACKUP" >/tmp/task10-db-restore.log 2>&1; then
                  echo "ROLLBACK_FAILED_DATABASE_RESTORE"
                  rollback_failed=1
                  rollback_state_failed=1
                fi
              else
                echo "ROLLBACK_FAILED_DATABASE_BACKUP_MISSING"
                rollback_failed=1
                rollback_state_failed=1
              fi
            else
              echo "ROLLBACK_DATABASE_SKIPPED"
            fi
            if [ "$rollback_state_failed" -ne 0 ]; then
              echo "DEPLOY_FAILED_ROLLBACK_STATE_RESTORE_INCOMPLETE"
              echo "DEPLOY_FAILED_ROLLBACK_INCOMPLETE"
              exit 97
            fi
            if [ -x "$DATAHUB_REPO/backend/.venv/bin/python" ]; then
              if ! "$DATAHUB_REPO/backend/.venv/bin/python" -m pip install -r "$DATAHUB_REPO/backend/requirements.txt"; then
                echo "ROLLBACK_FAILED_BACKEND_REQUIREMENTS"
                rollback_failed=1
              fi
            else
              echo "ROLLBACK_FAILED_BACKEND_VENV"
              rollback_failed=1
            fi
            if ! (
              cd "$DATAHUB_REPO/frontend" &&
              npm ci --no-audit --no-fund &&
              npm run build
            ); then
              echo "ROLLBACK_FAILED_FRONTEND_BUILD"
              rollback_failed=1
            fi
            if ! restore_hermes_runtime_dropin; then
              echo "ROLLBACK_FAILED_HERMES_RUNTIME_DROPIN"
              rollback_failed=1
            else
              echo "ROLLBACK_HERMES_RUNTIME_RESTORED"
            fi
            if [ "$rollback_failed" -ne 0 ]; then
              echo "DEPLOY_FAILED_ROLLBACK_BUILD_RESTORE_INCOMPLETE"
              echo "DEPLOY_FAILED_ROLLBACK_INCOMPLETE"
              exit 97
            fi
            if ! systemctl restart aluminum-bypass; then
              echo "ROLLBACK_FAILED_ALUMINUM_BYPASS_SERVICE"
              rollback_failed=1
            fi
            if ! systemctl restart hermes-gateway; then
              echo "ROLLBACK_FAILED_HERMES_GATEWAY_SERVICE"
              rollback_failed=1
            fi
            if ! reload_or_restart_nginx; then
              echo "ROLLBACK_FAILED_NGINX_SERVICE"
              rollback_failed=1
            fi
            if ! systemctl is-active aluminum-bypass hermes-gateway nginx >/tmp/task10-rollback-service-status.log; then
              echo "ROLLBACK_FAILED_SERVICE_HEALTH"
              rollback_failed=1
            fi
            rollback_readyz_ok=0
            for attempt in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:8000/readyz >/tmp/task10-rollback-readyz.json; then
                rollback_readyz_ok=1
                break
              fi
              sleep 2
            done
            if [ "$rollback_readyz_ok" != "1" ]; then
              echo "ROLLBACK_FAILED_READYZ"
              rollback_failed=1
            fi
            if [ "$rollback_failed" -eq 0 ]; then
              echo "DEPLOY_FAILED_ROLLBACK_DONE"
              exit "$exit_code"
            fi
            echo "DEPLOY_FAILED_ROLLBACK_INCOMPLETE"
            exit 97
          }

          RAW_DATABASE_URL="$(read_env_value DATABASE_URL "$DATAHUB_ENV_FILE")"
          if [ -z "$RAW_DATABASE_URL" ]; then
            echo "DATABASE_URL_MISSING"
            exit 40
          fi
          DATABASE_LIBPQ_URL="$(libpq_url_from_database_url "$RAW_DATABASE_URL")"
          PRE_MIGRATION_REVISIONS=""
          POST_MIGRATION_REVISIONS=""

          if [ "$MODE" = "status" ]; then
            report_status "no"
            exit 0
          fi

          require_clean_tracked "DATAHUB" "$DATAHUB_REPO"
          require_clean_tracked "HERMES" "$HERMES_REPO"

          require_commit_exists "$DATAHUB_REPO" "$DATAHUB_SHA"
          update_trusted_refs
          require_commit_exists "$HERMES_REPO" "$HERMES_SHA"
          if [ "$MODE" = "rollback" ]; then
            require_trusted_ancestor "$DATAHUB_REPO" "$DATAHUB_SHA" "$DATAHUB_TRUSTED_REF" DATAHUB
            require_trusted_ancestor "$HERMES_REPO" "$HERMES_SHA" "$HERMES_TRUSTED_REF" HERMES
          else
            require_trusted_head "$DATAHUB_REPO" "$DATAHUB_SHA" "$DATAHUB_TRUSTED_REF" DATAHUB
            require_trusted_head "$HERMES_REPO" "$HERMES_SHA" "$HERMES_TRUSTED_REF" HERMES
          fi

          capture_hermes_gateway_command_contract
          prepare_hermes_runtime "$HERMES_SHA"

          mkdir -p "$BACKUP_DIR"
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          DB_BACKUP="$BACKUP_DIR/pre-task10-deploy-${timestamp}.dump"
          pg_dump --format=custom --file "$DB_BACKUP" "$DATABASE_LIBPQ_URL"
          pg_restore -l "$DB_BACKUP" >/tmp/task10-db-backup.list

          DATAHUB_ENV_BACKUP="$(backup_env_file "$DATAHUB_ENV_FILE")"
          HERMES_ENV_BACKUP="$(backup_env_file "$HERMES_ENV_FILE")"
          backup_hermes_runtime_dropin

          trap 'rc=$?; if [ "$rc" -ne 0 ]; then rollback_on_error "$rc"; fi' EXIT

          git -C "$DATAHUB_REPO" checkout --detach "$DATAHUB_SHA"
          DATAHUB_CHECKOUT_DONE=1

          if [ ! -x "$DATAHUB_REPO/backend/.venv/bin/python" ]; then
            echo "BACKEND_VENV_MISSING"
            exit 41
          fi

          "$DATAHUB_REPO/backend/.venv/bin/python" -m pip install -r "$DATAHUB_REPO/backend/requirements.txt"
          NEEDS_DB_RESTORE=1
          if PRE_MIGRATION_REVISIONS="$(get_alembic_revisions "$RAW_DATABASE_URL")"; then
            :
          else
            echo "PRE_MIGRATION_REVISION_DETECTION_FAILED"
            exit 45
          fi
          echo "PRE_MIGRATION_REVISIONS=$PRE_MIGRATION_REVISIONS"
          if ! (
            cd "$DATAHUB_REPO/backend" &&
            DATABASE_URL="$RAW_DATABASE_URL" ./.venv/bin/python -m alembic upgrade head
          ); then
            exit 42
          fi
          if POST_MIGRATION_REVISIONS="$(get_alembic_revisions "$RAW_DATABASE_URL")"; then
            :
          else
            echo "POST_MIGRATION_REVISION_DETECTION_FAILED"
            exit 46
          fi
          echo "POST_MIGRATION_REVISIONS=$POST_MIGRATION_REVISIONS"
          if alembic_revisions_valid "$PRE_MIGRATION_REVISIONS" && alembic_revisions_valid "$POST_MIGRATION_REVISIONS" && [ "$PRE_MIGRATION_REVISIONS" = "$POST_MIGRATION_REVISIONS" ]; then
            NEEDS_DB_RESTORE=0
          fi

          (
            cd "$DATAHUB_REPO/frontend" &&
            npm ci --no-audit --no-fund &&
            npm run build
          )

          systemctl stop hermes-gateway
          git -C "$HERMES_REPO" checkout --detach "$HERMES_SHA"
          HERMES_CHECKOUT_DONE=1
          write_hermes_runtime_dropin "$HERMES_TARGET_RUNTIME_ENV"
          echo "HERMES_DEPENDENCY_SYNC=locked_dingtalk_runtime"

          upsert_env_value "$DATAHUB_ENV_FILE" "BUILD_SHA" "$DATAHUB_SHA"
          upsert_env_value "$DATAHUB_ENV_FILE" "HERMES_BUILD_SHA" "$HERMES_SHA"

          systemctl restart aluminum-bypass
          systemctl restart hermes-gateway
          reload_or_restart_nginx

          readyz_ok=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readyz >/tmp/readyz.json; then
              readyz_ok=1
              break
            fi
            sleep 3
          done
          if [ "$readyz_ok" != "1" ]; then
            echo "READYZ_FAILED_AFTER_DEPLOY"
            exit 43
          fi

          curl -fsS http://127.0.0.1:8000/versionz >/tmp/versionz.json
          python3 - "$DATAHUB_SHA" "$HERMES_SHA" /tmp/versionz.json <<'PY'
          import json
          import sys
          from pathlib import Path

          expected_datahub = sys.argv[1]
          expected_hermes = sys.argv[2]
          payload = json.loads(Path(sys.argv[3]).read_text(encoding='utf-8'))
          if payload != {
              "datahub_sha": expected_datahub,
              "hermes_sha": expected_hermes,
          }:
              raise SystemExit(1)
          print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
          PY

          [ "$(git -C "$DATAHUB_REPO" rev-parse HEAD)" = "$DATAHUB_SHA" ]
          [ "$(git -C "$HERMES_REPO" rev-parse HEAD)" = "$HERMES_SHA" ]

          smoke_token="$(read_env_value HERMES_DINGTALK_INBOUND_TOKEN "$DATAHUB_ENV_FILE")"
          if [ -z "$smoke_token" ]; then
            smoke_token="$(read_env_value DINGTALK_INBOUND_TOKEN "$DATAHUB_ENV_FILE")"
          fi
          smoke_user_id="$(read_env_value HERMES_SMOKE_ROOT_OWNER_USER_ID "$DATAHUB_ENV_FILE")"
          if [ -z "$smoke_user_id" ]; then
            smoke_user_id="$(read_env_value HERMES_OWNER_DINGTALK_USER_IDS "$DATAHUB_ENV_FILE" | cut -d',' -f1 | xargs)"
          fi
          smoke_union_id="$(read_env_value HERMES_SMOKE_ROOT_OWNER_UNION_ID "$DATAHUB_ENV_FILE")"
          if [ -z "$smoke_token" ] || [ -z "$smoke_user_id" ]; then
            echo "SMOKE_INPUTS_MISSING"
            exit 44
          fi
          smoke_trace="smoke-trace-$(date -u +%Y%m%dT%H%M%SZ)"
          python3 - "$smoke_user_id" "$smoke_union_id" "$smoke_trace" >/tmp/task10-smoke-payload.json <<'PY'
          import json
          import sys

          payload = {
              "senderStaffId": sys.argv[1],
              "text": {"content": "【Task10 smoke】只做真实入站留痕，不发钉钉外发。"},
              "agentCode": "factory_dispatch",
              "traceId": sys.argv[3],
              "queueOutbox": False,
          }
          if sys.argv[2]:
              payload["senderUnionId"] = sys.argv[2]
          print(json.dumps(payload, ensure_ascii=False))
          PY
          smoke_timestamp="$(date +%s)"
          smoke_nonce="smoke-${smoke_trace}"
          smoke_kind="task10_smoke"
          smoke_signature="$(python3 - "$smoke_token" "$smoke_timestamp" "$smoke_nonce" "$smoke_kind" /tmp/task10-smoke-payload.json <<'PY'
          import hashlib
          import hmac
          import json
          import sys

          secret, timestamp, nonce, kind, payload_path = sys.argv[1:]
          with open(payload_path, encoding="utf-8") as handle:
              payload = json.load(handle)
          canonical = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
          signed = (
              timestamp.encode("ascii")
              + b"."
              + nonce.encode("ascii")
              + b"."
              + kind.encode("ascii")
              + b"."
              + canonical
          )
          print(hmac.new(secret.encode("utf-8"), signed, hashlib.sha256).hexdigest())
          PY
          )"
          curl -fsS \
            -H "content-type: application/json" \
            -H "x-dingtalk-inbound-timestamp: $smoke_timestamp" \
            -H "x-dingtalk-inbound-nonce: $smoke_nonce" \
            -H "x-dingtalk-inbound-kind: $smoke_kind" \
            -H "x-dingtalk-inbound-signature: sha256=$smoke_signature" \
            --data @/tmp/task10-smoke-payload.json \
            http://127.0.0.1:8000/api/v1/dingtalk/agent-inbound >/tmp/task10-smoke-response.json
          cat /tmp/task10-smoke-response.json
          echo
          echo "SMOKE_TRACE_ID=$smoke_trace"
          echo "SMOKE_PERSISTENCE=$(verify_smoke_trace_persisted "$RAW_DATABASE_URL" "$smoke_trace")"

          report_stream_connection "yes" 40 3
          echo "STREAM_PERSISTENCE=$(query_stream_persistence "$RAW_DATABASE_URL")"

          report_status "yes"
          if [ -n "$HERMES_RUNTIME_DROPIN_BACKUP" ]; then
            rm -f "$HERMES_RUNTIME_DROPIN_BACKUP"
          fi
          trap - EXIT
          REMOTE
          } | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$SSH_USER@$SSH_HOST" "bash -s"
