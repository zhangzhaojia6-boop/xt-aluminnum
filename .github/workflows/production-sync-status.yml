          report_hermes_runtime() {
            local host_os_id="unknown"
            local host_os_version_id="unknown"
            local host_python_311
            local host_python_312
            local host_uv
            local runtime_pid
            local runtime_python
            if [ -r /etc/os-release ]; then
              host_os_id="$(. /etc/os-release; printf '%s' "${ID:-unknown}")"
              host_os_version_id="$(. /etc/os-release; printf '%s' "${VERSION_ID:-unknown}")"
            fi
            host_uv="$(command -v uv 2>/dev/null || true)"
            host_python_311="$(command -v python3.11 2>/dev/null || true)"
            host_python_312="$(command -v python3.12 2>/dev/null || true)"
            echo "HERMES_SERVICE_FRAGMENT_PATH=$(systemctl show -p FragmentPath --value hermes-gateway 2>/dev/null || true)"
            echo "HERMES_SERVICE_USER=$(systemctl show -p User --value hermes-gateway 2>/dev/null || true)"
            echo "HERMES_SERVICE_WORKING_DIRECTORY=$(systemctl show -p WorkingDirectory --value hermes-gateway 2>/dev/null || true)"
            echo "HERMES_HOST_OS_ID=$host_os_id"
            echo "HERMES_HOST_OS_VERSION_ID=$host_os_version_id"
            echo "HERMES_HOST_UV=${host_uv:-missing}"
            echo "HERMES_HOST_PYTHON_3_11=${host_python_311:-missing}"
            echo "HERMES_HOST_PYTHON_3_12=${host_python_312:-missing}"
            runtime_pid="$(systemctl show -p MainPID --value hermes-gateway 2>/dev/null || true)"
            if ! printf '%s' "$runtime_pid" | grep -Eq '^[1-9][0-9]*$'; then
              echo "HERMES_RUNTIME_PYTHON=unavailable"
              echo "HERMES_RUNTIME_INSPECTION=main_pid_unavailable"
              return 0
            fi
            runtime_python="$(resolve_hermes_runtime_python "$runtime_pid" 2>/dev/null || true)"
            echo "HERMES_RUNTIME_PYTHON=${runtime_python:-unavailable}"
            echo "HERMES_RUNTIME_CWD=$(readlink -f "/proc/$runtime_pid/cwd" 2>/dev/null || true)"
            if [ -z "$runtime_python" ] || [ ! -x "$runtime_python" ]; then
              echo "HERMES_RUNTIME_INSPECTION=executable_unavailable"
              return 0
            fi
            case "$runtime_python" in
              */python|*/python[0-9]|*/python[0-9].*) ;;
              *)
                echo "HERMES_RUNTIME_INSPECTION=main_process_is_not_python"
                return 0
                ;;
            esac
            "$runtime_python" - "$runtime_pid" <<'PY'
          from importlib import metadata
          from pathlib import Path
          import re
          import shlex
          import subprocess
          import sys

          def package_version(name: str) -> str:
              try:
                  return metadata.version(name)
              except metadata.PackageNotFoundError:
                  return "missing"

          def safe_entrypoint(value: str) -> str:
              if len(value) > 300 or not re.fullmatch(r"[A-Za-z0-9_./:-]+", value):
                  return "redacted"
              if re.search(r"secret|token|password|credential|app[_-]?key", value, re.IGNORECASE):
                  return "redacted"
              return value

          runtime_pid = sys.argv[1]
          raw_args = Path(f"/proc/{runtime_pid}/cmdline").read_bytes().split(b"\0")
          args = [item.decode("utf-8", errors="replace") for item in raw_args if item]
          if "-m" not in args[1:]:
              service_exec = subprocess.check_output(
                  ["systemctl", "show", "-p", "ExecStart", "--value", "hermes-gateway"],
                  text=True,
              ).strip()
              match = re.search(r"path=(\S+)\s*;\s*argv\[\]=(.*?)\s*;", service_exec)
              if match is not None:
                  service_args = shlex.split(match.group(2))
                  if service_args:
                      args = service_args
          entrypoint = "unavailable"
          try:
              module_index = args.index("-m", 1)
          except ValueError:
              module_index = -1
          if module_index >= 0 and len(args) > module_index + 1:
              entrypoint = "module:" + safe_entrypoint(args[module_index + 1])
          else:
              for candidate in args[1:]:
                  if candidate == "-P":
                      continue
                  if candidate.startswith("-"):
                      break
                  entrypoint = "script:" + safe_entrypoint(candidate)
                  break

          print("HERMES_RUNTIME_PYTHON_VERSION=" + ".".join(str(part) for part in sys.version_info[:3]))
          print(f"HERMES_RUNTIME_PREFIX={sys.prefix}")
          print(f"HERMES_RUNTIME_BASE_PREFIX={sys.base_prefix}")
          print(f"HERMES_RUNTIME_IS_VENV={str(sys.prefix != sys.base_prefix).lower()}")
          print(f"HERMES_RUNTIME_PACKAGE_VERSION={package_version('hermes-agent')}")
          print(f"HERMES_RUNTIME_DINGTALK_STREAM_VERSION={package_version('dingtalk-stream')}")
          print(f"HERMES_RUNTIME_ENTRYPOINT={entrypoint}")
          PY
          }

          report_stream_diagnostics() {
            local active_since="${1:-}"
            local diagnostic_file
            local client_id
            local client_secret
            local robot_code
            local log_file
            diagnostic_file="$(mktemp /tmp/hermes-stream-diagnostics.XXXXXX)"

            {
              echo "__JOURNAL__"
              journalctl -u hermes-gateway --since "$active_since" --no-pager -o short-iso -n 300 2>&1 || true
              for log_file in \
                "$HERMES_HOME/logs/agent.log" \
                "$HERMES_HOME/logs/gateway.log" \
                "$HERMES_HOME/logs/errors.log"; do
                if [ -f "$log_file" ]; then
                  echo "__FILE__=$(basename "$log_file")"
                  tail -n 300 "$log_file" 2>&1 || true
                fi
              done
            } > "$diagnostic_file"

            client_id="$(read_env_value DINGTALK_CLIENT_ID "$HERMES_ENV_FILE")"
            client_secret="$(read_env_value DINGTALK_CLIENT_SECRET "$HERMES_ENV_FILE")"
            robot_code="$(read_env_value DINGTALK_ROBOT_CODE "$HERMES_ENV_FILE")"

            echo "HERMES_STREAM_DIAGNOSTICS_START"
            if ! python3 - "$diagnostic_file" "$client_id" "$client_secret" "$robot_code" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          sensitive_values = [value for value in sys.argv[2:] if value]
          lifecycle = re.compile(
              r"dingtalk|stream(?: mode| client| connection| websocket)|messaging platforms?|"
              r"platform adapter|adapter could|plugin platform|websocket",
              re.IGNORECASE,
          )
          user_content = re.compile(
              r"(?i)(?<![A-Za-z0-9_])[\"']?(?:text|content|message|messages|prompt|answer|"
              r"payload|query|input|output)[\"']?\s*[:=]"
          )
          lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
          selected = [line for line in lines if line.startswith("__") or lifecycle.search(line)]
          for line in selected[-240:]:
              for value in sensitive_values:
                  line = line.replace(value, "[REDACTED]")
              content_match = user_content.search(line)
              if content_match:
                  line = line[:content_match.start()] + "content=[REDACTED]"
              line = re.sub(
                  r"(?i)(access[_-]?token=)[^&\s]+",
                  r"\1[REDACTED]",
                  line,
              )
              line = re.sub(
                  r"(?i)([?&](?:access[_-]?token|ticket|client[_-]?id|app[_-]?key|robot(?:[_-]?code)?)=)[^&\s\"']+",
                  r"\1[REDACTED]",
                  line,
              )
              line = re.sub(
                  r"(?i)([\"']?(?:access[_-]?token|ticket|client[_-]?id|app[_-]?key|robot(?:[_-]?code)?)[\"']?\s*[:=]\s*[\"']?)[^&\s,\"'\x7d]+",
                  r"\1[REDACTED]",
                  line,
              )
              line = re.sub(
                  r"(?i)((?:client|app)[_-]?secret\s*[:=]\s*)[^\s,;]+",
                  r"\1[REDACTED]",
                  line,
              )
              line = re.sub(
                  r"(?i)(authorization\s*[:=]\s*(?:bearer\s+)?)[^\s,;]+",
                  r"\1[REDACTED]",
                  line,
              )
              print(line)
          PY
            then
              echo "HERMES_STREAM_DIAGNOSTICS_UNAVAILABLE"
            fi
            rm -f "$diagnostic_file"
            echo "HERMES_STREAM_DIAGNOSTICS_END"
          }

          stream_runtime_state_is_connected() {
            local active_since_epoch="$1"
            local main_pid
            local main_start_time
            main_pid="$(systemctl show -p MainPID --value hermes-gateway 2>/dev/null)"
            main_start_time=""
            if [[ "$main_pid" =~ ^[1-9][0-9]*$ ]] && [ -r "/proc/$main_pid/stat" ]; then
              main_start_time="$(python3 -c 'from pathlib import Path; import sys; print(Path(f"/proc/{int(sys.argv[1])}/stat").read_text(encoding="utf-8").split()[21])' "$main_pid" 2>/dev/null || true)"
            fi
            python3 - "$HERMES_HOME/gateway_state.json" "$main_pid" "$main_start_time" "$active_since_epoch" <<'PY'
          from datetime import datetime, timezone
          import json
          from pathlib import Path
          import sys

          state_path = Path(sys.argv[1])
          expected_pid = sys.argv[2]
          expected_start_time = sys.argv[3]
          active_since_epoch = int(sys.argv[4])

          try:
              payload = json.loads(state_path.read_text(encoding="utf-8"))
              if not isinstance(payload, dict):
                  raise ValueError("runtime state is not an object")
          except (OSError, UnicodeError, json.JSONDecodeError, ValueError):
              print("HERMES_STREAM_STATE_FILE=unavailable")
              raise SystemExit(1)

          platforms = payload.get("platforms")
          platform = platforms.get("dingtalk", {}) if isinstance(platforms, dict) else {}
          state_pid = str(payload.get("pid", ""))
          state_start_time = str(payload.get("start_time", ""))
          gateway_state = payload.get("gateway_state")
          dingtalk_state = platform.get("state") if isinstance(platform, dict) else None
          updated_at = platform.get("updated_at") if isinstance(platform, dict) else None
          pid_match = expected_pid.isdigit() and int(expected_pid) > 0 and state_pid == expected_pid
          start_match = expected_start_time.isdigit() and state_start_time == expected_start_time

          updated_epoch = None
          if isinstance(updated_at, str):
              try:
                  normalized = updated_at[:-1] + "+00:00" if updated_at.endswith("Z") else updated_at
                  parsed = datetime.fromisoformat(normalized)
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=timezone.utc)
                  updated_epoch = parsed.timestamp()
              except ValueError:
                  pass
          fresh = updated_epoch is not None and updated_epoch > active_since_epoch

          safe_gateway_state = gateway_state if gateway_state in {"starting", "running", "draining", "stopping", "stopped", "startup_failed"} else "invalid"
          safe_dingtalk_state = dingtalk_state if dingtalk_state in {"connected", "disconnected", "fatal"} else "invalid"
          print(f"HERMES_STREAM_STATE_PID_MATCH={'yes' if pid_match else 'no'}")
          print(f"HERMES_STREAM_STATE_START_MATCH={'yes' if start_match else 'no'}")
          print(f"HERMES_STREAM_STATE_GATEWAY={safe_gateway_state}")
          print(f"HERMES_STREAM_STATE_DINGTALK={safe_dingtalk_state}")
          print(f"HERMES_STREAM_STATE_FRESH={'yes' if fresh else 'no'}")
          healthy = pid_match and start_match and gateway_state == "running" and dingtalk_state == "connected" and fresh
          raise SystemExit(0 if healthy else 1)
          PY
          }

          report_stream_connection() {
            local require_connected="$1"
            local attempts="${2:-1}"
            local delay_seconds="${3:-0}"
            local active_since
            local active_since_epoch
            local attempt
            local connected
            local state_output
            active_since="$(systemctl show -p ActiveEnterTimestamp --value hermes-gateway)"
            echo "HERMES_ACTIVE_ENTER_TIMESTAMP=$active_since"
            if ! active_since_epoch="$(date -d "$active_since" +%s 2>/dev/null)"; then
              echo "HERMES_ACTIVE_ENTER_TIMESTAMP_INVALID"
              active_since_epoch=9223372036854775807
            fi
            connected="no"
            state_output=""
            for attempt in $(seq 1 "$attempts"); do
              if state_output="$(stream_runtime_state_is_connected "$active_since_epoch" 2>&1)"; then
                connected="yes"
                break
              fi
              if ! systemctl is-active --quiet hermes-gateway; then
                echo "HERMES_GATEWAY_INACTIVE_DURING_STREAM_WAIT"
                break
              fi
              if [ "$attempt" -lt "$attempts" ]; then
                sleep "$delay_seconds"
              fi
            done
            if [ -n "$state_output" ]; then
              printf '%s\n' "$state_output"
            fi
            if [ "$connected" = "yes" ]; then
              echo "HERMES_STREAM_CONNECTED=yes"
              echo "HERMES_STREAM_CONNECTED_LINE=runtime_state"
            else
              echo "HERMES_STREAM_CONNECTED=no"
              echo "HERMES_STREAM_CONNECTED_LINE=none"
              if [ "$require_connected" = "yes" ]; then
                if ! report_stream_diagnostics "$active_since"; then
                  echo "HERMES_STREAM_DIAGNOSTICS_UNAVAILABLE"
                fi
                return 1
              fi
            fi
          }

          verify_hermes_restart_journal() {
            local since_epoch="$1"
            local journal_file
            local service_result
            journal_file="$(mktemp /tmp/hermes-restart-journal.XXXXXX)"
            if ! journalctl -u hermes-gateway --since "@$since_epoch" --no-pager -o cat > "$journal_file" 2>&1; then
              rm -f "$journal_file"
              echo "HERMES_RESTART_JOURNAL=unavailable"
              return 1
            fi
            if grep -Eiq \
              "Failed with result ['\"]exit-code['\"]|Platform ['\"]Feishu / Lark['\"] requirements not met|Platform ['\"]feishu['\"]|No adapter available for feishu|restart_drain_timeout.*expected|TimeoutStopSec.*expected" \
              "$journal_file"; then
              rm -f "$journal_file"
              echo "HERMES_RESTART_JOURNAL=unexpected_lifecycle_warning"
              return 1
            fi
            rm -f "$journal_file"
            service_result="$(systemctl show -p Result --value hermes-gateway 2>/dev/null || true)"
            if [ "$service_result" != "success" ]; then
              echo "HERMES_RESTART_JOURNAL=service_result_${service_result:-unknown}"
              return 1
            fi
            echo "HERMES_RESTART_JOURNAL=clean"
          }

          report_status() {
            local version_required="$1"
            local contract_gate_script="$DATAHUB_REPO/backend/scripts/check_daily_report_field_contract.py"

            print_repo_status "DATAHUB" "$DATAHUB_REPO"
            print_repo_status "HERMES" "$HERMES_REPO"

            echo "SERVICE_STATUS_START"
            systemctl is-active aluminum-bypass hermes-gateway nginx
            echo "SERVICE_STATUS_END"

            if [ "$version_required" = "yes" ]; then
              report_http_json "READYZ" "http://127.0.0.1:8000/readyz" /tmp/readyz.json
            else
              report_http_json "READYZ" "http://127.0.0.1:8000/readyz" /tmp/readyz.json || true
            fi
            if [ "$version_required" = "yes" ]; then
              report_http_json "VERSIONZ" "http://127.0.0.1:8000/versionz" /tmp/versionz.json
            else
              report_http_json "VERSIONZ" "http://127.0.0.1:8000/versionz" /tmp/versionz.json || true
            fi

            if [ -f "$contract_gate_script" ]; then
              echo "DAILY_REPORT_FIELD_CONTRACT_GATE_START"
              (
                cd "$DATAHUB_REPO/backend"
                ./.venv/bin/python scripts/check_daily_report_field_contract.py --json
              )
              echo "DAILY_REPORT_FIELD_CONTRACT_GATE_END"
            else
              echo "DAILY_REPORT_FIELD_CONTRACT_GATE=not_available_for_sha"
            fi

            report_managed_uv_state
            report_hermes_runtime
            report_hermes_dingtalk_access
            if capture_hermes_gateway_command_contract; then
              echo "HERMES_GATEWAY_DEPLOY_CONTRACT=ready"
            else
              echo "HERMES_GATEWAY_DEPLOY_CONTRACT=rejected"
            fi
            report_stream_connection "no" || true
            echo "STREAM_PERSISTENCE=$(query_stream_persistence "$RAW_DATABASE_URL")"
            echo "LATEST_STREAM_TRACE=$(query_latest_stream_trace "$RAW_DATABASE_URL")"
          }

          reload_or_restart_nginx() {
            if systemctl reload nginx; then
              return 0
            fi
            systemctl restart nginx
          }

          configure_hermes_dingtalk_access() {
            local runtime_python="$HERMES_TARGET_RUNTIME_ENV/bin/python"
            test -x "$runtime_python"
            HERMES_HOME="$HERMES_HOME" "$runtime_python" -P - "$HERMES_DM_ALLOWED_USERS" <<'PY'
          import sys

          from hermes_cli.config import get_config_path, read_raw_config, require_readable_config_before_write
          from utils import atomic_yaml_write

          dm_allowed_users = [item.strip() for item in sys.argv[1].split(",") if item.strip()]
          if len(dm_allowed_users) != 3 or len(set(dm_allowed_users)) != 3:
              raise SystemExit("invalid DingTalk DM allowlist")

          config_path = get_config_path()
          require_readable_config_before_write(config_path)
          config = read_raw_config()
          platforms = config.get("platforms")
          platforms = dict(platforms) if isinstance(platforms, dict) else {}
          dingtalk = platforms.get("dingtalk")
          dingtalk = dict(dingtalk) if isinstance(dingtalk, dict) else {}
          extra = dingtalk.get("extra")
          extra = dict(extra) if isinstance(extra, dict) else {}
          extra["dm_allowed_users"] = dm_allowed_users
          extra["require_mention"] = True
          extra["allowed_chats"] = []
          extra["free_response_chats"] = []
          dingtalk["extra"] = extra
          platforms["dingtalk"] = dingtalk
          config["platforms"] = platforms
          atomic_yaml_write(config_path, config, sort_keys=False)
          print("HERMES_DINGTALK_ACCESS_CONFIGURED=yes")
          PY
          }

          report_hermes_dingtalk_access() {
            local runtime_python=""
            local runtime_pid
            if [ -n "$HERMES_TARGET_RUNTIME_ENV" ] && [ -x "$HERMES_TARGET_RUNTIME_ENV/bin/python" ]; then
              runtime_python="$HERMES_TARGET_RUNTIME_ENV/bin/python"
            else
              runtime_pid="$(systemctl show -p MainPID --value hermes-gateway)"
              runtime_python="$(resolve_hermes_runtime_python "$runtime_pid")"
            fi
            HERMES_HOME="$HERMES_HOME" "$runtime_python" -P - "$HERMES_DM_ALLOWED_USERS" <<'PY'
          import sys

          from hermes_cli.config import read_raw_config

          expected = {item.strip() for item in sys.argv[1].split(",") if item.strip()}
          config = read_raw_config()
          platforms = config.get("platforms") if isinstance(config, dict) else {}
          dingtalk = platforms.get("dingtalk") if isinstance(platforms, dict) else {}
          extra = dingtalk.get("extra") if isinstance(dingtalk, dict) else {}
          extra = extra if isinstance(extra, dict) else {}
          actual = {str(item).strip() for item in extra.get("dm_allowed_users", []) if str(item).strip()}
          mention_required = extra.get("require_mention") is True
          all_groups = not extra.get("allowed_chats") and not extra.get("free_response_chats")
          print(f"HERMES_DM_ALLOWED_USER_COUNT={len(actual)}")
          print(f"HERMES_DM_ALLOWED_USERS_MATCH={'yes' if actual == expected else 'no'}")
          print(f"HERMES_GROUP_REQUIRE_MENTION={'yes' if mention_required else 'no'}")
          print(f"HERMES_GROUP_SCOPE={'all_application_groups' if all_groups else 'restricted'}")
          PY
          }

          apply_dingtalk_stream_config() {
            local stream_app_key
            local stream_app_secret
            local stream_robot_code
            local stream_agent_id
            local stream_app_id
            local stream_relay_token

            stream_app_key="$(decode_b64 "$STREAM_APP_KEY_B64")"
            stream_app_secret="$(decode_b64 "$STREAM_APP_SECRET_B64")"
            stream_robot_code="$(decode_b64 "$STREAM_ROBOT_CODE_B64")"
            stream_agent_id="$(decode_b64 "$STREAM_AGENT_ID_B64")"
            stream_app_id="$(decode_b64 "$STREAM_APP_ID_B64")"
            if [ -z "$stream_app_key" ] || [ -z "$stream_app_secret" ]; then
              echo "DINGTALK_STREAM_DEPLOY_CREDENTIALS_MISSING"
              return 1
            fi

            stream_relay_token="$(read_env_value HERMES_DINGTALK_STREAM_RELAY_TOKEN "$DATAHUB_ENV_FILE")"
            if [ -z "$stream_relay_token" ]; then
              stream_relay_token="$(openssl rand -hex 32)"
            fi

            upsert_env_value "$DATAHUB_ENV_FILE" "DINGTALK_STREAM_ENABLED" "true"
            upsert_env_value "$DATAHUB_ENV_FILE" "HERMES_DINGTALK_MODE" "stream"
            upsert_env_value "$DATAHUB_ENV_FILE" "DINGTALK_APP_KEY" "$stream_app_key"
            upsert_env_value "$DATAHUB_ENV_FILE" "DINGTALK_APP_SECRET" "$stream_app_secret"
            upsert_env_value "$DATAHUB_ENV_FILE" "DINGTALK_AUTHORIZED_GROUP_IDS" "*"
            upsert_env_value "$DATAHUB_ENV_FILE" "HERMES_DINGTALK_STREAM_RELAY_TOKEN" "$stream_relay_token"
            if [ -n "$stream_robot_code" ]; then
              upsert_env_value "$DATAHUB_ENV_FILE" "DINGTALK_ROBOT_CODE" "$stream_robot_code"
              upsert_env_value "$HERMES_ENV_FILE" "DINGTALK_ROBOT_CODE" "$stream_robot_code"
            fi
            if [ -n "$stream_agent_id" ]; then
              upsert_env_value "$DATAHUB_ENV_FILE" "DINGTALK_AGENT_ID" "$stream_agent_id"
            fi
            if [ -n "$stream_app_id" ]; then
              upsert_env_value "$DATAHUB_ENV_FILE" "DINGTALK_APP_ID" "$stream_app_id"
            fi

            upsert_env_value "$HERMES_ENV_FILE" "DINGTALK_CLIENT_ID" "$stream_app_key"
            upsert_env_value "$HERMES_ENV_FILE" "DINGTALK_CLIENT_SECRET" "$stream_app_secret"
            upsert_env_value "$HERMES_ENV_FILE" "DINGTALK_ALLOWED_USERS" "*"
            upsert_env_value "$HERMES_ENV_FILE" "DINGTALK_ALLOWED_CHATS" ""
            upsert_env_value "$HERMES_ENV_FILE" "DINGTALK_FREE_RESPONSE_CHATS" ""
            upsert_env_value "$HERMES_ENV_FILE" "DINGTALK_REQUIRE_MENTION" "true"
            upsert_env_value "$HERMES_ENV_FILE" "HERMES_LANGUAGE" "zh"
            upsert_env_value "$HERMES_ENV_FILE" "XINTAI_SOUL_SYNC_ENABLED" "true"
            upsert_env_value "$HERMES_ENV_FILE" "XINTAI_EVIDENCE_RELAY_ENABLED" "true"
            upsert_env_value "$HERMES_ENV_FILE" "XINTAI_DATAHUB_BASE_URL" "http://127.0.0.1:8000"
            upsert_env_value "$HERMES_ENV_FILE" "XINTAI_DINGTALK_STREAM_RELAY_TOKEN" "$stream_relay_token"
            configure_hermes_dingtalk_access
            echo "HERMES_DINGTALK_ALLOWED_USERS_SCOPE=enterprise_app"
            echo "DINGTALK_STREAM_CONFIGURATION_APPLIED=yes"
          }

          rollback_on_error() {
            local exit_code="${1:-1}"
            local rollback_failed=0
            local rollback_state_failed=0
            local rollback_current_revisions=""
            trap - EXIT ERR
            echo "DEPLOY_FAILED_ROLLBACK_START"
            if ! stop_hermes_gateway || ! systemctl stop aluminum-bypass; then
              echo "ROLLBACK_FAILED_STOP_RUNTIME_SERVICES"
              echo "DEPLOY_FAILED_ROLLBACK_INCOMPLETE"
              exit 97
            fi
            if [ "$NEEDS_DB_RESTORE" = "1" ] && [ -n "${PRE_MIGRATION_REVISIONS:-}" ]; then
              if ! alembic_single_revision_valid "$PRE_MIGRATION_REVISIONS"; then
                echo "ROLLBACK_FAILED_DATABASE_DOWNGRADE_PRE_REVISION"
                rollback_failed=1
                rollback_state_failed=1
              elif ! rollback_current_revisions="$(get_alembic_revisions "$RAW_DATABASE_URL")"; then
                echo "ROLLBACK_FAILED_DATABASE_DOWNGRADE_CURRENT_REVISION"
                rollback_failed=1
                rollback_state_failed=1
              elif [ "$rollback_current_revisions" != "$PRE_MIGRATION_REVISIONS" ]; then
                echo "ROLLBACK_DATABASE_DOWNGRADE_TO=$PRE_MIGRATION_REVISIONS"
                if ! (
                  cd "$DATAHUB_REPO/backend" &&
                  DATABASE_URL="$RAW_DATABASE_URL" ./.venv/bin/python -m alembic downgrade "$PRE_MIGRATION_REVISIONS"
                ); then
                  echo "ROLLBACK_FAILED_DATABASE_DOWNGRADE"
                  rollback_failed=1
                  rollback_state_failed=1
                fi
              else
                echo "ROLLBACK_DATABASE_DOWNGRADE_SKIPPED=already_at_pre_deploy_revision"
              fi
            else
              echo "ROLLBACK_DATABASE_DOWNGRADE_SKIPPED=no_migration_state_change"
            fi
            if [ "$DATAHUB_CHECKOUT_DONE" = "1" ]; then
              if ! git -C "$DATAHUB_REPO" checkout --detach "$PREVIOUS_DATAHUB_HEAD"; then
                echo "ROLLBACK_FAILED_DATAHUB_REPO"
                rollback_failed=1
                rollback_state_failed=1
              fi
            fi
            if [ "$HERMES_CHECKOUT_DONE" = "1" ]; then
              if ! git -C "$HERMES_REPO" checkout --detach "$PREVIOUS_HERMES_HEAD"; then
                echo "ROLLBACK_FAILED_HERMES_REPO"
                rollback_failed=1
                rollback_state_failed=1
              fi
            fi
            if ! restore_env_backup "$DATAHUB_ENV_FILE" "$DATAHUB_ENV_BACKUP"; then
              echo "ROLLBACK_FAILED_DATAHUB_ENV"
              rollback_failed=1
              rollback_state_failed=1
            fi
            if ! restore_env_backup "$HERMES_ENV_FILE" "$HERMES_ENV_BACKUP"; then
              echo "ROLLBACK_FAILED_HERMES_ENV"
              rollback_failed=1
              rollback_state_failed=1
            fi
            if ! restore_env_backup "$HERMES_CONFIG_FILE" "$HERMES_CONFIG_BACKUP"; then
              echo "ROLLBACK_FAILED_HERMES_CONFIG"
              rollback_failed=1
              rollback_state_failed=1
            fi
            if [ "$NEEDS_DB_RESTORE" = "1" ]; then
              if [ -n "$DB_BACKUP" ] && [ -f "$DB_BACKUP" ]; then
                echo "ROLLBACK_DATABASE_FROM=$DB_BACKUP"
                if ! pg_restore --single-transaction --exit-on-error --clean --if-exists --no-owner --no-privileges -d "$DATABASE_LIBPQ_URL" "$DB_BACKUP" >/tmp/task10-db-restore.log 2>&1; then
                  echo "ROLLBACK_FAILED_DATABASE_RESTORE"
                  rollback_failed=1
                  rollback_state_failed=1
                fi
              else
                echo "ROLLBACK_FAILED_DATABASE_BACKUP_MISSING"
                rollback_failed=1
                rollback_state_failed=1
              fi
            else
              echo "ROLLBACK_DATABASE_SKIPPED"
            fi
            if [ "$rollback_state_failed" -ne 0 ]; then
              echo "DEPLOY_FAILED_ROLLBACK_STATE_RESTORE_INCOMPLETE"
              echo "DEPLOY_FAILED_ROLLBACK_INCOMPLETE"
              exit 97
            fi
            if [ -x "$DATAHUB_REPO/backend/.venv/bin/python" ]; then
              if ! "$DATAHUB_REPO/backend/.venv/bin/python" -m pip install -r "$DATAHUB_REPO/backend/requirements.txt"; then
                echo "ROLLBACK_FAILED_BACKEND_REQUIREMENTS"
                rollback_failed=1
              fi
            else
              echo "ROLLBACK_FAILED_BACKEND_VENV"
              rollback_failed=1
            fi
            if ! (
              cd "$DATAHUB_REPO/frontend" &&
              npm ci --no-audit --no-fund &&
              npm run build
            ); then
              echo "ROLLBACK_FAILED_FRONTEND_BUILD"
              rollback_failed=1
            fi
            if ! restore_hermes_runtime_dropin; then
              echo "ROLLBACK_FAILED_HERMES_RUNTIME_DROPIN"
              rollback_failed=1
            else
              echo "ROLLBACK_HERMES_RUNTIME_RESTORED"
            fi
            if [ "$rollback_failed" -ne 0 ]; then
              echo "DEPLOY_FAILED_ROLLBACK_BUILD_RESTORE_INCOMPLETE"
              echo "DEPLOY_FAILED_ROLLBACK_INCOMPLETE"
              exit 97
            fi
            if ! systemctl restart aluminum-bypass; then
              echo "ROLLBACK_FAILED_ALUMINUM_BYPASS_SERVICE"
              rollback_failed=1
            fi
            if ! systemctl start hermes-gateway; then
              echo "ROLLBACK_FAILED_HERMES_GATEWAY_SERVICE"
              rollback_failed=1
            fi
            if ! reload_or_restart_nginx; then
              echo "ROLLBACK_FAILED_NGINX_SERVICE"
              rollback_failed=1
            fi
            if ! systemctl is-active aluminum-bypass hermes-gateway nginx >/tmp/task10-rollback-service-status.log; then
              echo "ROLLBACK_FAILED_SERVICE_HEALTH"
              rollback_failed=1
            fi
            rollback_readyz_ok=0
            for attempt in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:8000/readyz >/tmp/task10-rollback-readyz.json; then
                rollback_readyz_ok=1
                break
              fi
              sleep 2
            done
            if [ "$rollback_readyz_ok" != "1" ]; then
              echo "ROLLBACK_FAILED_READYZ"
              rollback_failed=1
            fi
            if [ "$rollback_failed" -eq 0 ]; then
              echo "DEPLOY_FAILED_ROLLBACK_DONE"
              exit "$exit_code"
            fi
            echo "DEPLOY_FAILED_ROLLBACK_INCOMPLETE"
            exit 97
          }

          RAW_DATABASE_URL="$(read_env_value DATABASE_URL "$DATAHUB_ENV_FILE")"
          if [ -z "$RAW_DATABASE_URL" ]; then
            echo "DATABASE_URL_MISSING"
            exit 40
          fi
          DATABASE_LIBPQ_URL="$(libpq_url_from_database_url "$RAW_DATABASE_URL")"
          PRE_MIGRATION_REVISIONS=""
          POST_MIGRATION_REVISIONS=""

          if [ "$MODE" = "status" ]; then
            report_status "no"
            exit 0
          fi

          require_clean_tracked "DATAHUB" "$DATAHUB_REPO"
          require_clean_tracked "HERMES" "$HERMES_REPO"

          require_commit_exists "$DATAHUB_REPO" "$DATAHUB_SHA"
          update_trusted_refs
          require_commit_exists "$HERMES_REPO" "$HERMES_SHA"
          if [ "$MODE" = "rollback" ]; then
            require_trusted_ancestor "$DATAHUB_REPO" "$DATAHUB_SHA" "$DATAHUB_TRUSTED_REF" DATAHUB
            require_trusted_ancestor "$HERMES_REPO" "$HERMES_SHA" "$HERMES_TRUSTED_REF" HERMES
          else
            require_trusted_head "$DATAHUB_REPO" "$DATAHUB_SHA" "$DATAHUB_TRUSTED_REF" DATAHUB
            require_trusted_head "$HERMES_REPO" "$HERMES_SHA" "$HERMES_TRUSTED_REF" HERMES
          fi

          capture_hermes_gateway_command_contract
          prepare_hermes_runtime "$HERMES_SHA"

          mkdir -p "$BACKUP_DIR"
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          DB_BACKUP="$BACKUP_DIR/pre-task10-deploy-${timestamp}.dump"
          pg_dump --format=custom --file "$DB_BACKUP" "$DATABASE_LIBPQ_URL"
          pg_restore -l "$DB_BACKUP" >/tmp/task10-db-backup.list

          DATAHUB_ENV_BACKUP="$(backup_env_file "$DATAHUB_ENV_FILE")"
          HERMES_ENV_BACKUP="$(backup_env_file "$HERMES_ENV_FILE")"
          HERMES_CONFIG_BACKUP="$(backup_env_file "$HERMES_CONFIG_FILE")"
          backup_hermes_runtime_dropin

          trap 'rc=$?; if [ "$rc" -ne 0 ]; then rollback_on_error "$rc"; fi' EXIT

          git -C "$DATAHUB_REPO" checkout --detach "$DATAHUB_SHA"
          DATAHUB_CHECKOUT_DONE=1

          if [ ! -x "$DATAHUB_REPO/backend/.venv/bin/python" ]; then
            echo "BACKEND_VENV_MISSING"
            exit 41
          fi

          "$DATAHUB_REPO/backend/.venv/bin/python" -m pip install -r "$DATAHUB_REPO/backend/requirements.txt"
          NEEDS_DB_RESTORE=1
          if PRE_MIGRATION_REVISIONS="$(get_alembic_revisions "$RAW_DATABASE_URL")"; then
            :
          else
            echo "PRE_MIGRATION_REVISION_DETECTION_FAILED"
            exit 45
          fi
          echo "PRE_MIGRATION_REVISIONS=$PRE_MIGRATION_REVISIONS"
          if ! (
            cd "$DATAHUB_REPO/backend" &&
            DATABASE_URL="$RAW_DATABASE_URL" ./.venv/bin/python -m alembic upgrade head
          ); then
            exit 42
          fi
          if POST_MIGRATION_REVISIONS="$(get_alembic_revisions "$RAW_DATABASE_URL")"; then
            :
          else
            echo "POST_MIGRATION_REVISION_DETECTION_FAILED"
            exit 46
          fi
          echo "POST_MIGRATION_REVISIONS=$POST_MIGRATION_REVISIONS"
          if alembic_revisions_valid "$PRE_MIGRATION_REVISIONS" && alembic_revisions_valid "$POST_MIGRATION_REVISIONS" && [ "$PRE_MIGRATION_REVISIONS" = "$POST_MIGRATION_REVISIONS" ]; then
            NEEDS_DB_RESTORE=0
          fi

          (
            cd "$DATAHUB_REPO/frontend" &&
            npm ci --no-audit --no-fund &&
            npm run build
          )

          HERMES_RESTART_EPOCH="$(date +%s)"
          stop_hermes_gateway
          git -C "$HERMES_REPO" checkout --detach "$HERMES_SHA"
          HERMES_CHECKOUT_DONE=1
          write_hermes_runtime_dropin "$HERMES_TARGET_RUNTIME_ENV"
          echo "HERMES_DEPENDENCY_SYNC=locked_dingtalk_runtime"

          if [ "$MODE" = "deploy" ]; then
            apply_dingtalk_stream_config
          fi

          upsert_env_value "$DATAHUB_ENV_FILE" "BUILD_SHA" "$DATAHUB_SHA"
          upsert_env_value "$DATAHUB_ENV_FILE" "HERMES_BUILD_SHA" "$HERMES_SHA"

          systemctl restart aluminum-bypass
          systemctl start hermes-gateway
          reload_or_restart_nginx

          readyz_ok=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readyz >/tmp/readyz.json; then
              readyz_ok=1
              break
            fi
            sleep 3
          done
          if [ "$readyz_ok" != "1" ]; then
            echo "READYZ_FAILED_AFTER_DEPLOY"
            exit 43
          fi

          curl -fsS http://127.0.0.1:8000/versionz >/tmp/versionz.json
          python3 - "$DATAHUB_SHA" "$HERMES_SHA" /tmp/versionz.json <<'PY'
          import json
          import sys
          from pathlib import Path

          expected_datahub = sys.argv[1]
          expected_hermes = sys.argv[2]
          payload = json.loads(Path(sys.argv[3]).read_text(encoding='utf-8'))
          if payload != {
              "datahub_sha": expected_datahub,
              "hermes_sha": expected_hermes,
          }:
              raise SystemExit(1)
          print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
          PY

          [ "$(git -C "$DATAHUB_REPO" rev-parse HEAD)" = "$DATAHUB_SHA" ]
          [ "$(git -C "$HERMES_REPO" rev-parse HEAD)" = "$HERMES_SHA" ]

          smoke_token="$(read_env_value HERMES_DINGTALK_INBOUND_TOKEN "$DATAHUB_ENV_FILE")"
          if [ -z "$smoke_token" ]; then
            smoke_token="$(read_env_value DINGTALK_INBOUND_TOKEN "$DATAHUB_ENV_FILE")"
          fi
          smoke_user_id="$(read_env_value HERMES_SMOKE_ROOT_OWNER_USER_ID "$DATAHUB_ENV_FILE")"
          if [ -z "$smoke_user_id" ]; then
            smoke_user_id="$(read_env_value HERMES_OWNER_DINGTALK_USER_IDS "$DATAHUB_ENV_FILE" | cut -d',' -f1 | xargs)"
          fi
          smoke_union_id="$(read_env_value HERMES_SMOKE_ROOT_OWNER_UNION_ID "$DATAHUB_ENV_FILE")"
          if [ -z "$smoke_token" ] || [ -z "$smoke_user_id" ]; then
            echo "SMOKE_INPUTS_MISSING"
            exit 44
          fi
          smoke_trace="smoke-trace-$(date -u +%Y%m%dT%H%M%SZ)"
          python3 - "$smoke_user_id" "$smoke_union_id" "$smoke_trace" >/tmp/task10-smoke-payload.json <<'PY'
          import json
          import sys

          payload = {
              "senderStaffId": sys.argv[1],
              "text": {"content": "【Task10 smoke】只做真实入站留痕，不发钉钉外发。"},
              "agentCode": "factory_dispatch",
              "traceId": sys.argv[3],
              "queueOutbox": False,
          }
          if sys.argv[2]:
              payload["senderUnionId"] = sys.argv[2]
          print(json.dumps(payload, ensure_ascii=False))
          PY
          smoke_timestamp="$(date +%s)"
          smoke_nonce="smoke-${smoke_trace}"
          smoke_kind="task10_smoke"
          smoke_signature="$(python3 - "$smoke_token" "$smoke_timestamp" "$smoke_nonce" "$smoke_kind" /tmp/task10-smoke-payload.json <<'PY'
          import hashlib
          import hmac
          import json
          import sys

          secret, timestamp, nonce, kind, payload_path = sys.argv[1:]
          with open(payload_path, encoding="utf-8") as handle:
              payload = json.load(handle)
          canonical = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
          signed = (
              timestamp.encode("ascii")
              + b"."
              + nonce.encode("ascii")
              + b"."
              + kind.encode("ascii")
              + b"."
              + canonical
          )
          print(hmac.new(secret.encode("utf-8"), signed, hashlib.sha256).hexdigest())
          PY
          )"
          curl -fsS \
            -H "content-type: application/json" \
            -H "x-dingtalk-inbound-timestamp: $smoke_timestamp" \
            -H "x-dingtalk-inbound-nonce: $smoke_nonce" \
            -H "x-dingtalk-inbound-kind: $smoke_kind" \
            -H "x-dingtalk-inbound-signature: sha256=$smoke_signature" \
            --data @/tmp/task10-smoke-payload.json \
            http://127.0.0.1:8000/api/v1/dingtalk/agent-inbound >/tmp/task10-smoke-response.json
          cat /tmp/task10-smoke-response.json
          echo
          echo "SMOKE_TRACE_ID=$smoke_trace"
          echo "SMOKE_PERSISTENCE=$(verify_smoke_trace_persisted "$RAW_DATABASE_URL" "$smoke_trace")"

          report_stream_connection "yes" 40 3
          verify_hermes_restart_journal "$HERMES_RESTART_EPOCH"
          echo "STREAM_PERSISTENCE=$(query_stream_persistence "$RAW_DATABASE_URL")"

          report_status "yes"
          if [ -n "$HERMES_RUNTIME_DROPIN_BACKUP" ]; then
            rm -f "$HERMES_RUNTIME_DROPIN_BACKUP"
          fi
          trap - EXIT
          REMOTE
          } | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$SSH_USER@$SSH_HOST" "bash -s"
