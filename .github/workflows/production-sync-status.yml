name: Production Sync Status

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type 'prod-sync' to confirm production repository sync
        required: true
      mode:
        description: Check status only, or fast-forward production to origin/main
        required: true
        default: status
        type: choice
        options:
          - status
          - sync

jobs:
  production-sync-status:
    if: github.event.inputs.confirm == 'prod-sync'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Check or sync production repository
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
          SYNC_MODE: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          case "$SYNC_MODE" in
            status|sync) ;;
            *) echo "unsupported mode"; exit 2 ;;
          esac

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "SYNC_MODE='$SYNC_MODE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /srv/aluminum-bypass

          echo "PROD_BRANCH=$(git branch --show-current)"
          echo "PROD_HEAD_BEFORE=$(git rev-parse HEAD)"
          git status --short --branch

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "PRODUCTION_REPOSITORY_HAS_TRACKED_LOCAL_CHANGES"
            git status --short
            exit 30
          fi

          git fetch origin main

          if [ "$SYNC_MODE" = "sync" ]; then
            git merge --ff-only origin/main
            env_file="/srv/aluminum-bypass/backend/.env"
            if [ -f "$env_file" ]; then
              cp -p "$env_file" "$env_file.backup-runtime-$(date +%Y%m%d%H%M%S)"

              read_env() {
                { grep -E "^$1=" "$env_file" || true; } | tail -n 1 | cut -d= -f2- | tr -d '\r'
              }

              write_env() {
                key="$1"
                value="$2"
                if grep -qE "^${key}=" "$env_file"; then
                  sed -i "s|^${key}=.*|${key}=${value}|" "$env_file"
                else
                  printf '\n%s=%s\n' "$key" "$value" >> "$env_file"
                fi
              }

              app_connection_mode="$(read_env APP_CONNECTION_PUSH_MODE | tr '[:upper:]' '[:lower:]')"
              app_connection_mode="${app_connection_mode:-disabled}"
              app_connection_enabled="$(read_env APP_CONNECTION_ENABLED | tr '[:upper:]' '[:lower:]')"
              app_connection_enabled="${app_connection_enabled:-false}"
              case "$app_connection_mode" in
                disabled|dry_run|enabled|"") ;;
                *)
                  if [ "$app_connection_enabled" = "true" ]; then
                    write_env APP_CONNECTION_PUSH_MODE dry_run
                  else
                    write_env APP_CONNECTION_PUSH_MODE disabled
                  fi
                  echo "REPAIRED_APP_CONNECTION_PUSH_MODE"
                  ;;
              esac

              mobile_mode="$(read_env MOBILE_DATA_ENTRY_MODE | tr '[:upper:]' '[:lower:]')"
              mobile_mode="${mobile_mode:-manual_only}"
              mobile_mes_display="$(read_env MOBILE_MES_DISPLAY_ENABLED | tr '[:upper:]' '[:lower:]')"
              mobile_mes_display="${mobile_mes_display:-false}"
              if [ "$mobile_mode" = "manual_only" ] && [ "$mobile_mes_display" = "true" ]; then
                write_env MOBILE_DATA_ENTRY_MODE mes_assisted
                echo "REPAIRED_MOBILE_DATA_ENTRY_MODE_FOR_MES_DISPLAY"
              fi
            fi
            echo "BUILD_FRONTEND"
            if command -v npm >/dev/null 2>&1; then
              (cd frontend && npm ci --no-audit --no-fund && npm run build)
              find frontend/dist/assets -maxdepth 1 -name 'Login-*.js' -printf 'FRONTEND_LOGIN_ASSET=%f\n' | sort | tail -n 1
            else
              echo "FRONTEND_BUILD_FAILED_NO_NPM"
              exit 32
            fi
            echo "RESTART_SERVICES"
            systemctl restart aluminum-bypass hermes-gateway
            systemctl reload nginx || systemctl restart nginx
          fi

          echo "PROD_HEAD_AFTER=$(git rev-parse HEAD)"
          echo "ORIGIN_MAIN=$(git rev-parse origin/main)"
          git status --short --branch

          echo "SERVICE_STATUS"
          systemctl is-active aluminum-bypass hermes-gateway nginx

          echo "READYZ"
          readyz_ok=0
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/readyz || curl -skfsS https://xtmijd.com/readyz; then
              readyz_ok=1
              break
            fi
            sleep 2
          done
          if [ "$readyz_ok" != "1" ]; then
            echo "READYZ_FAILED_AFTER_RESTART"
            systemctl status aluminum-bypass --no-pager -l || true
            journalctl -u aluminum-bypass -n 120 --no-pager || true
            exit 31
          fi
          REMOTE
