name: Archive Production Untracked

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type 'archive-untracked' to confirm production cleanup
        required: true
      mode:
        description: Dry-run first, then archive after reviewing the manifest
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - archive

jobs:
  archive-prod-untracked:
    if: github.event.inputs.confirm == 'archive-untracked'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Archive production untracked files
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
          CLEANUP_MODE: ${{ github.event.inputs.mode }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          case "$CLEANUP_MODE" in
            dry-run|archive) ;;
            *) echo "unsupported mode"; exit 2 ;;
          esac

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "CLEANUP_MODE='$CLEANUP_MODE' RUN_ID='$RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          repo="/srv/aluminum-bypass"
          archive_root="/var/backups/aluminum-bypass"
          test -d "$repo/.git"
          cd "$repo"

          tracked_dirty="$(git status --porcelain --untracked-files=no)"
          if [ -n "$tracked_dirty" ]; then
            echo "TRACKED_WORKTREE_NOT_CLEAN"
            printf '%s\n' "$tracked_dirty"
            exit 3
          fi

          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          timestamp="$(date +%Y%m%d-%H%M%S)"
          archive_dir="$archive_root/untracked-${timestamp}-run-${RUN_ID}"
          manifest="/tmp/aluminum-bypass-untracked-${RUN_ID}.tsv"

          python3 - "$repo" "$archive_root" "$archive_dir" "$manifest" "$CLEANUP_MODE" <<'PY'
          from __future__ import annotations

          import glob
          import os
          import shlex
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          repo = Path(sys.argv[1]).resolve()
          archive_root = Path(sys.argv[2]).resolve()
          archive_dir = Path(sys.argv[3]).resolve()
          manifest = Path(sys.argv[4])
          mode = sys.argv[5]


          def git(*args: str) -> bytes:
              return subprocess.check_output(["git", *args], cwd=repo)


          def command_text(command: str) -> str:
              result = subprocess.run(
                  command,
                  shell=True,
                  capture_output=True,
                  text=True,
                  check=False,
              )
              return result.stdout if result.returncode == 0 else ""


          def is_tracked(path: Path) -> bool:
              rel = path.relative_to(repo).as_posix()
              return subprocess.run(
                  ["git", "ls-files", "--error-unmatch", "--", rel],
                  cwd=repo,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              ).returncode == 0


          def inside(base: Path, path: Path) -> bool:
              try:
                  path.resolve().relative_to(base.resolve())
                  return True
              except ValueError:
                  return False


          def path_size(path: Path) -> int:
              if path.is_symlink():
                  return 0
              if path.is_file():
                  return path.stat().st_size
              total = 0
              for root, dirs, files in os.walk(path):
                  dirs[:] = [item for item in dirs if item != ".git"]
                  for file_name in files:
                      item = Path(root) / file_name
                      if not item.is_symlink():
                          total += item.stat().st_size
              return total


          def is_candidate_script(path: Path) -> bool:
              return path.is_file() and path.suffix in {".py", ".sh"}


          def matches_runtime_reference(text: str, path: Path, rel: str) -> bool:
              if not text:
                  return False
              terms = (
                  str(path),
                  rel,
                  path.name,
              )
              lowered = text.lower()
              return any(term.lower() in lowered for term in terms if term)


          def reference_hits(path: Path) -> list[str]:
              rel = path.relative_to(repo).as_posix()
              hits: set[str] = set()

              for unit_path in Path("/etc/systemd/system").rglob("*"):
                  if not unit_path.is_file():
                      continue
                  try:
                      text = unit_path.read_text(encoding="utf-8", errors="ignore")
                  except OSError:
                      continue
                  if matches_runtime_reference(text, path, rel):
                      hits.add(f"systemd-path:{unit_path.name}")

              timers_output = command_text("systemctl list-timers --all --no-legend")
              timer_units: set[str] = set()
              for raw_line in timers_output.splitlines():
                  for token in raw_line.split():
                      if token.endswith(".timer"):
                          timer_units.add(token)
              for unit in sorted(timer_units):
                  text = command_text(f"systemctl cat {shlex.quote(unit)}")
                  if matches_runtime_reference(text, path, rel):
                      hits.add(f"systemctl-cat:{unit}")

              cron_candidates = sorted(set(glob.glob("/etc/cron*")) | set(glob.glob("/etc/cron*/*")))
              for cron_path_raw in cron_candidates:
                  cron_path = Path(cron_path_raw)
                  if not cron_path.is_file():
                      continue
                  try:
                      text = cron_path.read_text(encoding="utf-8", errors="ignore")
                  except OSError:
                      continue
                  if matches_runtime_reference(text, path, rel):
                      hits.add(f"cron:{cron_path}")

              user_crontab = command_text("crontab -l")
              if matches_runtime_reference(user_crontab, path, rel):
                  hits.add("crontab-l")

              return sorted(hits)


          candidates: set[Path] = set()

          for pattern in (
              ".backups",
              "backend/.env.backup-*",
              "backend/.env.bak-*",
              "backend/*.bak-*",
              "backend/scripts/*.bak-*",
              "docs/system-understanding-consolidated-*.rag-safe.md",
              "docs/superpowers/reports/daily-report-fact-closure-production-*",
              "docs/superpowers/reports/*-hermes-20-question-real-acceptance-production.md",
              "reference",
          ):
              for match in glob.glob(str(repo / pattern)):
                  candidates.add(Path(match))

          raw_untracked = git("ls-files", "--others", "--exclude-standard", "-z")
          for raw in raw_untracked.split(b"\0"):
              if raw:
                  candidates.add(repo / raw.decode())

          safe: list[Path] = []
          for path in sorted(candidates, key=lambda item: item.relative_to(repo).as_posix()):
              if not path.exists() and not path.is_symlink():
                  continue
              if path.name == ".git" or ".git" in path.parts:
                  continue
              if not inside(repo, path):
                  raise SystemExit(f"refusing outside path: {path}")
              if is_tracked(path):
                  continue
              safe.append(path)

          evaluated: list[dict[str, str | int]] = []
          with manifest.open("w", encoding="utf-8") as handle:
              handle.write("mode\tpath\ttype\tsize_bytes\treference_status\treference_hits\n")
              for path in safe:
                  rel = path.relative_to(repo).as_posix()
                  kind = "dir" if path.is_dir() else "file"
                  hits = reference_hits(path) if is_candidate_script(path) else []
                  reference_status = "referenced" if hits else ("clear" if is_candidate_script(path) else "n/a")
                  hit_text = ",".join(hits)
                  row = {
                      "mode": mode,
                      "path": rel,
                      "type": kind,
                      "size_bytes": path_size(path),
                      "reference_status": reference_status,
                      "reference_hits": hit_text,
                  }
                  evaluated.append(row)
                  handle.write(
                      f"{mode}\t{rel}\t{kind}\t{row['size_bytes']}\t{reference_status}\t{hit_text}\n"
                  )

          print(f"CLEANUP_MODE={mode}")
          print(f"REPO={repo}")
          print(f"ARCHIVE_DIR={archive_dir}")
          print(f"CANDIDATE_COUNT={len(evaluated)}")
          print(manifest.read_text(encoding="utf-8"))

          referenced_scripts = [item for item in evaluated if item["reference_status"] == "referenced"]
          if mode == "archive" and referenced_scripts:
              print("RUNTIME_REFERENCE_FOUND")
              for item in referenced_scripts:
                  print(f"{item['path']} => {item['reference_hits']}")
              raise SystemExit(4)

          if mode != "archive" or not safe:
              raise SystemExit(0)

          archive_root.mkdir(parents=True, exist_ok=True, mode=0o700)
          os.chmod(archive_root, 0o700)
          archive_dir.mkdir(parents=True, exist_ok=True, mode=0o700)
          os.chmod(archive_dir, 0o700)
          manifest_copy = archive_dir / "manifest.tsv"
          shutil.copy2(manifest, manifest_copy)
          os.chmod(manifest_copy, 0o600)

          for path in safe:
              rel = path.relative_to(repo)
              destination = archive_dir / rel
              destination.parent.mkdir(parents=True, exist_ok=True, mode=0o700)
              shutil.move(str(path), str(destination))

          for root, dirs, files in os.walk(archive_dir):
              os.chmod(root, 0o700)
              for dir_name in dirs:
                  os.chmod(Path(root) / dir_name, 0o700)
              for file_name in files:
                  os.chmod(Path(root) / file_name, 0o600)
          PY

          if [ -d "$archive_dir" ]; then
            find "$archive_dir" -type d -exec chmod 700 {} +
            find "$archive_dir" -type f -exec chmod 600 {} +
            if [ -f "$archive_dir/manifest.tsv" ]; then
              chmod 600 "$archive_dir/manifest.tsv"
            fi
          fi

          if [ "$CLEANUP_MODE" = "archive" ]; then
            echo "POST_CLEAN_STATUS"
            git status --short --branch
            echo "TRACKED_STATUS"
            git status --short --untracked-files=no
            curl -fsS http://127.0.0.1:8000/readyz
          fi
          REMOTE
