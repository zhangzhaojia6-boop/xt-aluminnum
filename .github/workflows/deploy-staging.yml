name: Deploy Staging

on:
  workflow_dispatch:
  push:
    branches:
      - codex/gai

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t xintai-backend:staging ./backend
      - name: Build frontend image
        run: docker build -t xintai-frontend:staging ./frontend
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "STAGING_SSH_HOST is not configured; image build completed."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            'cd /opt/xintai-data-center && git pull --ff-only && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build'
